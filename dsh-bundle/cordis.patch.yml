# fenix-dsh-bundle 的 Cordis patch 层（bundle patch）。
# 应用顺序：dsh.profile.bundles 中排在本 bundle 之前的层（dsh-base / dsh-headless）
# 全部应用完后，再应用本文件，最后才是 profile cordis.patch.yml 与 --patch 覆盖。
#
# 装配链：
#   1. fenix-model-config —— 校验模型三要素并 provide `fenixModelConfig` 服务；
#      校验失败（model 缺失 / 版本不符）在本插件 apply 内抛错。
#   2. llm-pi-ai / agent-default-model —— providers 与默认模型由 fenixModelConfig
#      渲染（!!js 从注入服务取值）。agent-default-model 双行互补装配
#      （add-dispatch-precheck-true-fallback D1 真对称回落）：config.model 整体
#      缺席（回落形态）时 dsh-base 原生行以自身默认档配置供数、本 bundle 插入行
#      禁用；显式链形态反之。本 patch 对原生行不携带 config 键（patch 逐键覆盖、
#      无 config 键即不替换原 config），零硬编码 dsh 默认值；providers 在回落
#      形态插值为 undefined → llm-pi-ai schema 缺省 {}（dsh 零路由的原生休眠形态）。
#      任一形态恰好一行激活，agentDefaultModel 服务名不冲突；本插件失败时两行
#      一起 pending → headless-runner 一起失败 → StartupError 语义不变。
#   3. fenix-dsh-bundle —— Task 工具族 + 三守卫主插件。
#   4. sandbox-policy / approval —— 非交互审批（等价 claude bypassPermissions）：
#      沙箱 danger-full-access + 审批 never；两块面由 fenix-approval 在启动期
#      断言（被 --patch 覆盖回受限值即启动报错）；三守卫挂在 tools/pre-execute，
#      先于审批裁决生效，拦截不受全放行影响。
#      ⚠ sandbox-policy / approval 两键是 dsh 侧配置条目（本文件下方的
#      `- id: ...` config 段），MUST NOT 写进上方任何 entry 的 inject 列表：
#      inject 会令 cordis 等待一个「永不激活的服务」，插件 entry 卡在
#      pending（实测报文 "waiting for service: sandbox-policy"）、Task 工具族
#      不注册（2026-10-14 端到端冒烟实证）。approval 面由 fenix-approval 的
#      apply 以惰性 ctx.get 读取并断言；sandbox 模式 apply 期实测不可读，
#      由本文件写死期望值 + assertSandboxModeSafe 供装配方与测试校验
#      （见 approval.ts 头注）。
#   5. headless-runner 追加注入 fenixModelConfig —— headless-runner 是 dsh 的
#      required 启动条目：模型配置缺失 / 版本不符时它一起失败 → StartupError
#      exit 1（fail-fast，不静默降级）。本 bundle 供 headless 车道专用；
#      其它 profile（无 headless-runner 条目）挂载本 bundle 会因 patch 目标
#      不存在而启动报错，属预期行为。
- insert:
    - id: fenix-model-config
      name: fenix-dsh-bundle/modelConfig
    - id: fenix-dsh-bundle
      name: fenix-dsh-bundle
      inject: [fenixModelConfig, tools, approval]
    - id: fenix-approval
      name: fenix-dsh-bundle/approval
      inject: [approval]
    # 显式链形态的 agent-default-model 行（fenix 三要素供数）；回落形态由
    # 下方补丁行放开的 dsh-base 原生行供数（见「真对称回落」段注释）。
    - id: fenix-agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      inject: [fenixModelConfig]
      disabled: !!js ctx.fenixModelConfig.mode === 'fallback'
      config:
        provider: !!js ctx.fenixModelConfig.provider
        model: !!js ctx.fenixModelConfig.model
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: llm-pi-ai
  inject: [fenixModelConfig]
  config:
    providers: !!js ctx.fenixModelConfig.providers
# ── 真对称回落：agent-default-model 双行互补（add-dispatch-precheck-true-fallback D1）──
# 对 dsh-base 原生行只追加 inject 与互补 disabled、不携带 config 键——patch 逐键
# 覆盖，原 config（dsh 自身默认档）原样保留供回落形态使用；显式链形态本行禁用、
# 由上方插入行以 fenix 三要素供数。inject fenixModelConfig 确保形态判定发生在
# 服务在场之后：本插件失败（版本钉扎不符等）时两行一起 pending → headless-runner
# 一起失败 → StartupError fail-fast 语义不变。
- id: agent-default-model
  inject: [fenixModelConfig]
  disabled: !!js ctx.fenixModelConfig.mode === 'explicit'
- id: headless-runner
  inject: [headlessStartup, fenixModelConfig]
