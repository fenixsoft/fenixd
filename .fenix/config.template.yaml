# Fenix Loop Engineering Framework Configuration
# ================================================
# This file controls all aspects of the fenixd daemon and its Agents.
# Modify values to adapt the framework to your project.
#
# 该模板由 `fenix-init` 生成项目配置时渲染；
# {{PROJECT_NAME}} 与 {{PROJECT_TYPE}} 会被替换为实际项目名/类型。

# ---- Project Identity ----
project:
  name: "{{PROJECT_NAME}}"           # Project name (used in reports)
  type: "{{PROJECT_TYPE}}"           # web | cli | library | api
  root: "."                       # Project root relative to .fenix/
  # description: ""              # 项目简介，由 fenix-setup 自动生成，可在 Dashboard 修改

# ---- Scheduling ----
schedule:
  # Interval (minutes) for periodic full-state scan as fallback
  poll_interval_minutes: 30
  # Time of day for daily report generation (HH:MM, 24h format)
  daily_report_time: "09:00"
  # 注：schedule.stuck_threshold_minutes 已弃用。stuck 判定阈值改为由
  # agents.run_timeout_seconds 单源派生（run_timeout + 600s 宽限），旧键不再生效。
  # 此处不再保留该配置行，避免与超时参数再次手工漂移脱钩。

# ---- LLM Provider 注册表（可选）----
# 定义多个 LLM Provider，供 agents.models 引用。
# 未配置时所有 Agent 使用默认环境变量模型（现状行为）。
# llm:
#   providers:
#     - name: "volc-engine"            # 唯一标识，被 agents.models 引用
#       baseurl: "https://api.example.com/v1"
#       apikey: "sk-xxx"               # 敏感信息，.fenix/config.yaml 已 gitignore
#       model: "deepseek-v4-flash"     # 该 Provider 的默认模型名（实际发给网关的模型名）

# ---- Agent Configuration ----
agents:
  # 并行度：同时运行的 Agent 进程数上限。
  # 调度采用严格优先级并行：高优先级（priority 数值小）先执行；
  # 同一优先级内的任务可并行至该上限；不同优先级不并行
  # （低优先级等高优先级全部完成后才启动，不抢占已在运行的任务）。
  max_concurrent: 2
  # Maximum retry attempts for a failed Agent run
  max_retries: 3
  # 实现尝试总预算（add-fail-counter-budget D2/D3）：每 spec 跨修复周期的实现
  # run 启动次数上限（含首次实现与每轮修复重派、含单次派发的重试 attempt）。
  # 达到预算 → 状态 blocked + 人工裁决告警，不再自动重派，需人工处置。
  # 合法范围 1-10；留空/注释即采用缺省值 4。修改后约 30s 配置热更新生效。
  impl_run_budget: 4
  # 单 spec 累计 input token 预算（add-cost-observability D5，单位：百万）。
  # 收工累计达到 80% 发提醒级告警、100% 发升级级告警（不自动冻结，由人工决定处置）。
  # 合法范围 0-1000；设为 0 表示关闭预算检查。留空即采用缺省值 50。
  token_budget_millions: 50
  # Maximum turns per Agent invocation (claude -p --max-turns)
  # 默认 300：单次 Agent 运行轮次上限（覆盖旧默认值 50/150）。该值为「上限」而非目标，
  # 超时/强杀保护仍在；对 32 场景级别验证为合理预算。
  max_turns: 300
  # Daily limit on total Agent runs (0 = unlimited)
  daily_run_limit: 300
  # Timeout in seconds for a single Agent run
  run_timeout_seconds: 3600
  # run_timeout 按 agent_type 覆盖（per-agent-timeout-override）：键 ∈ 全部七类
  # agent run（implementer/verifier/planner-plan/planner-judge/fast-track/repair/
  # administrator）+ supervision-judge；agent run 值须为 ≥300 整数，supervision-judge
  # 为 ≥1 整数。非法键值整条忽略（回退全局 run_timeout_seconds）并打 ERROR，其余合法键
  # 正常生效；supervision 的 extension 总额与 absolute_max 护栏按覆盖后生效值派生，
  # stuck 阈值派生保持全局默认值语义。缺省（不配置）时零行为变化。
  timeout_overrides:
    # planner-plan: 2700
    # supervision-judge: 120

  # 超时活性监督（improve-run-lifecycle-governance D3）。run 到达
  # run_timeout_seconds 不再直接 kill，而是按下方矩阵判定是否续期：
  #   1. 总墙钟 ≥ absolute_max_seconds → 无条件终止（封闭续期的成本风险）；
  #   2. 已续期 max_extensions 次 → 终止；
  #   3. judge_window 秒内零 run 事件 → 跳过 LLM、直接判停滞终止；
  #   4. LLM 判定 advancing（单轮轻量判定）→ deadline += extension_seconds 续期，
  #      并同步顺延 stuck 检测基准；判定 stagnant / judge 不可用 → 终止留证。
  # enabled: false 退回纯墙钟超时（现状行为）。
  # 注：canonical 位置在 agents.timeout_supervision；旧顶层 timeout_supervision
  # 键（enabled: false）仅作回退开关，两处同时配置时以本段为准。
  timeout_supervision:
    enabled: true
    # 单次续期秒数
    extension_seconds: 1800
    # 续期次数上限（0 = 到点即按活性判定终止，不续期）
    max_extensions: 2
    # 总墙钟上限（秒）；默认 7200 = 3600 运行 + 2×1800 续期
    absolute_max_seconds: 7200
    # 活性判定窗口（秒）：窗口内零事件直接判停滞；judge 的快照也取此窗口
    judge_window: 600
  # 使用三步验证流水线（Planner → VerifyEngine → Judge），比旧版 verifier 快 5-10x
  use_new_verifier: true

  # 按 Agent 角色分配模型（可选）。未列出的角色使用默认模型。
  # 角色可选: implementer | planner-plan | planner-judge | verifier | administrator
  #
  # provider 支持三种形态（逐字节向后兼容）：
  #   形态 1（字符串）：单值链，角色级 model 或 provider 条目 model 作为缺省。
  #     implementer:
  #       provider: "volc-engine"
  #       model: "deepseek-v4-flash"
  #
  #   形态 2（字符串数组）：按序候选链，元素级 model 均回退角色级或 provider 条目。
  #     implementer:
  #       provider: ["volc-engine", "aliyun"]
  #       model: "deepseek-v4-flash"
  #
  #   形态 3（对象数组）：每个元素可携带独立 model（跨供应商场景必需）。
  #     实现者 roles:
  #       provider:
  #         - provider: "inferaiapi.com"
  #           model: "deepseek-v4-flash"    # 该元素专用模型名
  #         - provider: "bigmodel.cn"
  #           model: "glm-5.3-flash"
  #
  # 混合形态（str|对象在同一数组中）也允许：
  #   provider:
  #     - provider: "inferaiapi.com"
  #       model: "deepseek-v4-flash"
  #     - "aliyun"                          # 回退角色级 model（若已提供）
  #
  # model 解析顺序（design D1）：元素自带 model > 角色级 model > providers 条目 model。
  # 三者皆空的元素在运行期被跳过（ERROR 日志记录元素下标，不阻塞加载）。
  # 角色级 model 不再要求非空（design D2），语义为全链缺省。
  # models:
  #   implementer:
  #     provider: "volc-engine"
  #     model: "deepseek-v4-flash"
  #   planner-plan:
  #     provider: "volc-engine"
  #     model: "deepseek-v4-pro"

# ---- Worktree Configuration ----
worktree:
  # Base directory for git worktrees
  base_dir: ".claude/worktrees"
  # Branch prefix for implementer worktrees
  implement_branch_prefix: "fenix"
  # Branch prefix for verifier worktrees
  verify_branch_prefix: "fenix/verify"

# ---- Gate Configuration ----
gates:
  # The ONLY human gate: push approval
  # All other stages are fully automated
  require_push_approval: true

  # 审批模式: manual（默认，人工审批） | auto（done 后自动 push）
  # auto 模式下 SPEC 到达 done 后 daemon 会自动 git push 并推进到 pushed 状态
  approve_mode: "manual"

# ---- Verify Contract ----
verify:
  # static 验证契约（.fenix/verify.yaml）的服务范围：
  #   main（默认，方案 1）— 在主树构建并起被测实例；实现合并后产物必然新鲜
  #   worktree（方案 2）— 在专用 serving worktree 内构建并起服务，隔离主树
  #     运行实例（每次 HEAD 变化自动重建 worktree 与产物，node_modules 自动
  #     从主树链入；详见 core/verify_contract.py 模块文档）
  static_scope: "main"

# ---- Push Ref Hygiene (fix-push-ref-lifecycle) ----
# done→pushed 的推送生命周期治理：
#   - main 优先推送（git push origin main）为成功判据，feature 分支尽力推送（留痕）
#   - 推送失败按指数退避延迟重试，退避期内 recovery 重放跳过
#   - 连续失败达 max_retries 后停止自动重试，发 push_failed 困境信号升级人工
pm:
  # 派发锁冲突退避（improve-run-lifecycle-governance D5）：派发 implementer 遇
  # 「worktree already active」时按此序列（秒）递增退避，期间不消耗 attempt 重试
  # 配额、不写 retries exhausted；spec 保持 ready 且 error 字段记录
  # 「backoff until <time>」。序列耗尽仍持锁 → dispatch_stalled 信号升级处置。
  dispatch_backoff_schedule: [30, 120, 600]
  push:
    # 指数退避秒数（默认 [300, 900]：首次失败后 5 分钟、再次失败后 15 分钟重试）
    retry_backoff_seconds: [300, 900]
    # 连续推送失败上限（默认 3）：达上限后停止自动重试并升级人工
    max_retries: 3

# ---- Dashboard (optional) ----
# Web Dashboard 默认端口（可选）。优先级: --port > ~/.config/fenixd/dashboard.yaml 的 port > 本字段 > 8787
dashboard:
  port: 8787

# ---- Administrator 自愈（可选）----
# Fenixd 无人值守自愈：轻量监视器零成本检测困境信号，困境才唤起 Administrator Agent 处置，
# 处置不了再升级人工（Dashboard 告警横幅）。admin.enabled: false 即整体停用。
admin:
  # 是否启用 Administrator 自愈
  enabled: true
  # 监视线程周期（分钟）
  interval_minutes: 5
  # Administrator Agent 使用的模型名（官方 Claude 模型名；未配置时复用框架默认 cc-switch 网关模型）
  agent_model: "claude-sonnet-5"
  # 同 spec 同类困境信号的唤起冷却（分钟），避免反复唤起烧钱
  escalation_cooldown_minutes: 15
  # 注：admin.stuck_threshold_minutes 已弃用。stuck 阈值现由 agents.run_timeout_seconds
  # 单源派生（run_timeout + 600s 宽限），此处不再保留该配置行。
  # merge 熔断阈值（复用 agents.merge_breaker_threshold 默认 2）
  # merge_breaker_threshold: 2
  # 规划性重启（supervisor 检测到 .fenix/restart_request）时的排水窗口（秒）：
  # daemon 收到 SIGTERM 后等待在跑 run 自然终态，到期才走 terminate 收口；
  # 0 = 不排水、保持现行快速停机。supervisor 的 SIGKILL 等待 = 本值 + 120s 余量。
  shutdown_drain_seconds: 1800

# ---- Agent Run 超时护栏（可选）----
# timeout_supervision 监控单次 Agent 运行的墙钟上限，防止超时参数再次与 run 超时脱钩。
# 护栏联动（design D5）：absolute_max_seconds MUST ≥ agents.run_timeout_seconds +
# 续期上限(7200s)，否则启动/热更新打 ERROR 并按 run_timeout_seconds + 7200 兜底生效。
timeout_supervision:
  # 是否启用 supervision（false 时整段不参与校验，也不对运行施加额外墙钟上限）
  enabled: false
  # 单次运行墙钟硬上限（秒）。默认值 14400 = run_timeout(3600) + 续期上限(7200) 对齐，
  # 与超时参数单源联动，杜绝「absolute_max 远小于跑满的运行」类脱钩事故。
  absolute_max_seconds: 14400

# ---- PM（派发与治理，可选）----
# 全部缺省均向后兼容：不配置时进入默认行为（老化关闭、族谱上限 3/2）。
pm:
  # 派发队列老化（design D3）：低优 SPEC 等待超过 initial_wait 后逐档降优先级，
  # 避免被高优 SPEC 长期饿死。内存态实现，daemon 重启重建队列即从零计时。
  dispatch:
    aging:
      # 是否启用老化（缺省 false：effective == base，行为与未启用完全一致）
      enabled: false
      # 等待多久（分钟）后开始老化
      initial_wait_minutes: 30
      # 每等待这么多分钟降一档（优先级数值 -1）
      step_down_minutes: 15
      # 最多降档数（封顶；P6 最多降到 P2，避免挤占高优窗口）
      floor_levels: 4
  # fix 族谱收敛（design D4）：fix- 前缀递归派生（fix-x → fix-fix-x → ...）的
  # 深度/宽度上限。越界时中止自动创建并产生 family_explosion 信号转人工处置。
  family:
    # 连续 fix- 前缀层数上限（缺省 3）
    # max_depth: 3
    # 同根未完成 fix 子代数量上限（缺省 2）
    # max_width: 2

# ---- Project-Specific Commands ----
commands:
  # Test command (how to run the test suite)
  test: "echo 'No tests configured yet'"
  # Build command
  build: "echo 'No build configured yet'"
  # Start command (for verifier to launch the project)
  start: "echo 'No start command configured yet'"

# ---- Logging ----
logging:
  # Log directory
  dir: ".fenix/logs"
  # Log level: DEBUG | INFO | WARNING | ERROR
  level: "INFO"
  # Maximum log file size before rotation (MB)
  max_size_mb: 10
  # Number of rotated log files to keep
  backup_count: 5
  # Days to retain logs
  retain_days: 30
