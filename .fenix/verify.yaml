# =============================================================================
# .fenix/verify.yaml — 声明式验证契约
# =============================================================================
#
# 【本文件的作用】
# 「最终用户验证」必须测"被测实现 fresh 构建出的可运行形态"。本文件向框架
# 声明三件事：应用如何构建（prepare）、如何被服务成可访问实例（serve）、
# 何时算就绪（ready）。框架在每轮验证前按序执行，并把验证场景的 URL 全量
# 改写到本次启动的实例——保证场景永远打新鲜实现，而不是 planner 臆测的
# 地址或上一次构建的陈旧产物。
#
# 没有本文件的项目：框架回退旧行为（config 的 commands.start + 端口改写），
# 存量项目零迁移；但没有构建声明的构建型应用会在合并后测到陈旧产物。
#
# 【字段说明】（完整权威文档见 core/verify_contract.py 模块注释）
#
# prepare   可选。构建步骤列表，验证前在项目根逐条执行：
#   - run   必填。字符串=经 shell 执行；YAML 列表=argv 直接执行
#   - cwd   可选。相对项目根的工作目录，缺省=项目根
#
# serve     可选。被测实例的启动方式；缺省回退 commands.start（旧行为）
#   kind    static=框架内置静态服务器（服务 root 目录，自动分配端口）
#           command=启动长驻服务命令（形态同 commands.start，项目根为 cwd）
#   root    kind=static 必填。URL 空间的根目录（相对项目根）——注意取的
#           是"路径前缀成立"的目录：本应用以 / 访问，故 root 取
#           core/dashboard/static（dist 的父目录）而非 dist 本身
#   cmd     kind=command 必填。服务启动命令
#   port    kind=command 可选。端口提示（供场景端口改写扫描）；
#           缺省时框架从 cmd 的 --port/-p 参数提取
#
# ready     可选。就绪探针；缺省探实例根路径、期望 200、等待 60 秒
#   url     探针路径（相对被测实例）
#   expect  期望 HTTP 状态码
#   timeout 就绪等待上限（秒）
#
# 【铁律】验证场景的 URL 由框架注入改写（BASE_URL），场景编写者与 planner
# 不需要（也不应该）硬编码实例地址。
# =============================================================================

prepare:
  - run: npm run build
    cwd: core/dashboard/static

serve:
  kind: static
  root: core/dashboard/static

ready:
  url: /
  expect: 200
  timeout: 120
