  function numSpan(s) { return h('span', { style: { fontVariantNumeric: 'tabular-nums' } }, s); }

  // ── 统一标题控件（standalone 壳位：渲染进顶栏，位于 Fenix Harness 品牌之后）──
  function TitleBar(props) {
    var meta = META[props.page];
    var kids = [];
    if (meta.back) {
      kids.push(h('span', {
        'data-proto-id': 'titlebar-back',
        onClick: function () { props.onPage('overview'); },
        style: { cursor: 'pointer', display: 'inline-flex', alignItems: 'center', marginRight: 6, color: INK2 },
      }, h('svg', { width: 14, height: 14, viewBox: '0 0 14 14', fill: 'none' },
        h('path', { d: 'M9 2.5 4.5 7 9 11.5', stroke: 'currentColor', strokeWidth: 1.4, strokeLinecap: 'round', strokeLinejoin: 'round' }))));
    }
    kids.push(h('span', { 'data-proto-id': 'titlebar-pagetitle', style: { fontSize: 18, fontWeight: 700, color: INK, lineHeight: '24px' } }, meta.title));
    if (meta.subtitle) {
      kids.push(h('span', { 'data-proto-id': 'titlebar-subtitle', style: { fontSize: 12, fontWeight: 400, color: INK3 } },
        meta.subtitle.map(function (p, i) { return p.num ? numSpan(p.t) : h('span', { key: i }, p.t); })));
    }
    var filterNodes = [];
    if (meta.filterLabel) filterNodes.push(h('span', { style: { fontSize: 13, color: INK2 } }, meta.filterLabel));
    (meta.filters || []).forEach(function (k) {
      if (k === 'scope') {
        filterNodes.push(h(antd.Select, {
          key: k, size: 'small', value: props.scope, onChange: props.setScope, style: { minWidth: 120 },
          options: [{ value: 'global', label: '全局' }, { value: 'fenixd', label: 'fenixd' }, { value: 'dsh-plugins', label: 'dsh-plugins' }],
        }));
      } else if (k === 'project') {
        filterNodes.push(h(antd.Select, { key: k, size: 'small', value: props.project, onChange: props.setProject, style: { minWidth: 128 }, options: PROJECT_OPTIONS }));
      } else if (k === 'win') {
        filterNodes.push(h(antd.Select, {
          key: k, size: 'small', value: props.win, onChange: props.setWin, style: { minWidth: 84 },
          options: [{ value: '24h', label: '24h' }, { value: '7d', label: '7d' }, { value: '30d', label: '30d' }],
        }));
      }
    });
    return h('div', { style: { flex: 1, display: 'flex', alignItems: 'center', minWidth: 0 } }, [
      h('div', { style: { display: 'flex', alignItems: 'baseline', gap: 10, paddingLeft: 16, minWidth: 0 } }, kids),

    ]);
  }

    var rows = [
      { key: 1, spec: 'fix-escalation-chain-watchdog-yield-gaps', status: 'implementing', c: 'processing', pri: 5, upd: '11-04 16:32' },
      { key: 2, spec: 'add-knowledge-inbox-pipeline', status: 'verifying', c: 'warning', pri: 5, upd: '11-04 15:08' },
      { key: 3, spec: 'fix-chain-admin-disposition-ledger-gap', status: 'ready', c: 'success', pri: 7, upd: '11-03 22:41' },
      { key: 4, spec: 'add-spec-manual-activation', status: 'drafted', c: 'default', pri: 5, upd: '11-02 09:17' },
    ];
    return h('div', { 'data-proto-id': 'content-project' }, [
      seg,
      h(antd.Card, { size: 'small' },
        h(antd.Table, { 'data-proto-id': 'content-project-table', size: 'middle', pagination: false, columns: cols, dataSource: rows, style: { fontVariantNumeric: 'tabular-nums' } })),
    ]);
  }

  function SettingsContent() {
    var inner = ['全局', '模型与网关', '链配置', '自省', '项目', 'Hook'];
    var cardStyle = { background: '#f6f6f6', marginBottom: 12 };
    return h('div', { 'data-proto-id': 'content-settings', style: { display: 'flex', gap: 16 } }, [
      h('div', { 'data-proto-id': 'content-settings-menu', style: { width: 160, flexShrink: 0 } },
        h(antd.Menu, {
          mode: 'inline', defaultSelectedKeys: ['全局'], style: { borderRight: 0 },
          items: inner.map(function (t) { return { key: t, label: t }; }),
        })),
      h('div', { style: { flex: 1, minWidth: 0 } }, [
        h(antd.Card, { size: 'small', title: '扫描节律', style: cardStyle },
          h(antd.Space, { size: 12 },
            h('span', null, '每日自省启动时刻'),
            h(antd.Select, { size: 'small', defaultValue: '00:00', style: { width: 110 }, options: [{ value: '00:00' }, { value: '02:00' }] }),
            h('span', null, '静默窗'),
            h(antd.Select, { size: 'small', defaultValue: 'off', style: { width: 110 }, options: [{ value: 'off', label: '关闭' }, { value: '01:00-07:00' }] }))),
        h(antd.Card, { size: 'small', title: '告警与升级', style: cardStyle },
          h(antd.Space, { size: 12 },
            h('span', null, '升级冷却'),
            h(antd.Input, { size: 'small', defaultValue: '60', style: { width: 90 }, suffix: '分钟' }),
            h('span', null, '孤儿宽限'),
            h(antd.Input, { size: 'small', defaultValue: '60', style: { width: 90 }, suffix: '分钟' }))),
      ]),
    ]);
  }

  function ActivitiesContent() {
    return h('div', { 'data-proto-id': 'content-activities' }, [
      h(antd.Radio.Group, { defaultValue: '全部', optionType: 'button', options: ['全部', 'Admin', 'Arbiter', '人工'], size: 'small', style: { marginBottom: 16 } }),
      h(antd.Card, { size: 'small' },
        h(antd.Timeline, {
          'data-proto-id': 'content-activities-timeline',
          items: [
            { children: '11-04 16:40 Admin 处置：链告警 escalation_stalled 已按预案重启链（fenixd）' },
            { children: '11-04 15:02 Arbiter 裁决：minor 批次 retian 放行（dsh-plugins）' },
            { children: '11-04 09:30 Admin 维护：分支 GC 宽限期回收 3 条（fenixd）' },
          ],
        })),
    ]);
  }

  function CmdCenterContent() {
    return h('div', { 'data-proto-id': 'content-cmdcenter' },
      h(antd.Tabs, {
        'data-proto-id': 'content-cmdcenter-tabs',
        defaultActiveKey: 'org',
        items: [{
          key: 'org', label: '组织总览',
          children: h('div', null, [
            h('div', { 'data-proto-id': 'content-cmdcenter-kpi', style: { display: 'flex', gap: 12, marginBottom: 16 } },
              [statCard('在办链', 3), statCard('队列水位', 6), statCard('24h 处置', 18), statCard('人工升级', 2)]),
            h('div', { style: { display: 'flex', gap: 12 } }, [
              h(antd.Card, { size: 'small', title: 'implementer ×4', style: { flex: 1 } }, '批量并行：cap 4 · 全部健康'),
              h(antd.Card, { size: 'small', title: 'code-fix ×2', style: { flex: 1 } }, '批内并行：回归门排队 1'),
            ]),
          ]),
        }, {
          key: 'pipe', label: '交付流水线',
          children: h('div', { style: { color: INK3, fontSize: 13, padding: '24px 0' } }, '（流水线泳道视图——原型仅示顶栏与过滤位，屏体不展开）'),
        }],
      }));
  }

  function HelpContent() {
    var toc = ['快速开始', 'SPEC 生命周期', '处置链', '知识真相源', '常见问题'];
    return h('div', { 'data-proto-id': 'content-help', style: { display: 'flex', gap: 16 } }, [
      h('div', { style: { width: 160, flexShrink: 0 } },
        h(antd.Menu, { mode: 'inline', defaultSelectedKeys: ['SPEC 生命周期'], style: { borderRight: 0 }, items: toc.map(function (t) { return { key: t, label: t }; }) })),
      h(antd.Card, { size: 'small', style: { flex: 1 }, title: 'SPEC 生命周期' },
        h('div', { 'data-proto-id': 'content-help-doc', style: { fontSize: 14, lineHeight: '24px', color: INK } }, [
          h('p', { key: 1, style: { margin: '0 0 12px' } }, 'SPEC 从 drafted（起草）经 ready（晋升）进入调度，daemon 按优先级与依赖关系派发实现 Agent；实现完成后进入验证管线与代码审查。'),
          h('p', { key: 2, style: { margin: 0 } }, '人工干预点：起草评审门（spec-review）与批准推送门（fenix-approve）。其余环节由框架自动推进。'),
        ])),
    ]);
  }

  function App() {
    var st = React.useState({ page: 'settings', scope: 'global', project: '', win: '24h' });
    var state = st[0], setState = st[1];
    var setPage = function (key) { setState(Object.assign({}, state, { page: key })); };
    var content = {
      overview: OverviewContent, project: ProjectContent, settings: SettingsContent,
      activities: ActivitiesContent, commandcenter: CmdCenterContent, help: HelpContent,
    }[state.page];
    return h(antd.ConfigProvider, { theme: { token: TOKEN, components: COMPONENTS } }, [
      h(TopBar, {
        key: 'topbar', page: state.page, onPage: setPage,
        scope: state.scope, setScope: function (v) { setState(Object.assign({}, state, { scope: v })); },
        project: state.project, setProject: function (v) { setState(Object.assign({}, state, { project: v })); },
        win: state.win, setWin: function (v) { setState(Object.assign({}, state, { win: v })); },
      }),
      h('div', { key: 'body', style: { display: 'flex' } }, [
        h(Sider, { key: 'sider', page: state.page, onPage: setPage }),
        h('div', { key: 'content', style: { flex: 1, minWidth: 0, padding: '16px ' + PAD_INLINE + 'px 24px' } }, h(content)),
      ]),
    ]);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
<script src="annotator.js" defer></script>
</body>
</html>
