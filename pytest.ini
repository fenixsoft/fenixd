# ── 仓级单源：凡以本仓为根执行 pytest 的入口（回归车道 / spec 验证链 /
#    开发者本地 / worktree）自动生效，无需逐入口追加命令行参数（设计 D1）。
#
# 单用例 10s 硬门（add-per-test-timeout-gate）：
#   - timeout = 10：每个用例 SHALL 在 10 秒内完成，超时判 FAILED。
#   - timeout_method = signal：SIGALRM 只中断主线程，超时用例判失败后同会话
#     继续执行；thread 方法会 dump 栈后 os._exit 整个 pytest 进程——一次慢
#     用例即杀掉整场回归，不适合作为全局方法（设计 D2）。
#
# 超时失败信息含机读标识「Timeout (>10.0s) from pytest-timeout」，回归读侧与
# 人工可据此区分「超时失败」与「断言失败」。
# 确需更久的用例：在 tests/timeout-allowlist.yaml 显式登记豁免
# （nodeid + timeout_seconds + reason），由 tests/test_timeout_gate.py 机械校验。
# 全局阈值不提供放宽配置项（设计 Non-Goals：防规则被静默稀释）。
[pytest]
timeout = 10
timeout_method = signal
