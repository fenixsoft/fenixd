      kids.push(h('div', { key: 'path', className: 'num', style: { fontSize: 12, color: C.text4, marginTop: 5 } }, p.path));
      // 批注 round6：长注释换行显示（pre-wrap），不再省略截断
      kids.push(h('div', { key: 'desc', style: { fontSize: 12, color: C.text3, marginTop: 4, whiteSpace: 'pre-wrap', lineHeight: '20px' } }, p.description || '暂无简介'));
      var tags = Object.keys(p.status_counts || {}).map(function (st) { return statusTag(st, p.status_counts[st]); });
      if (tags.length) kids.push(h('div', { key: 'tags', style: { display: 'flex', flexWrap: 'wrap', gap: 4, marginTop: 7 } }, tags));
    }
    return h('div', { style: { minWidth: 0 } }, kids);
  }
  function ProgressCell(p) {
    var pctv = Math.round((p.task_done / Math.max(1, p.task_total)) * 100);
    return h('div', { style: { minWidth: 0 } },
      h('div', { style: { display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 8 } },
        h('span', { style: { fontSize: 12, color: C.text3 } }, '任务进度'),
        h('span', { className: 'num', style: { fontSize: 12, fontWeight: 600 } }, p.task_done + '/' + p.task_total + ' · ' + pctv + '%')),
      h('div', { style: { marginTop: 6 } },
        h(Progress, { percent: pctv, size: 'small', strokeColor: C.blue, railColor: '#eef2f7', showInfo: false })));
  }
  function NumCell(v, color) {
    return h('span', { className: 'num', style: { fontSize: 16, fontWeight: 700, color: color || C.text } }, v);
  }
  function ActionsCell() {
    var menu = { items: [{ key: 'stop', label: '停止' }, { key: 'install', label: '安装托管' }, { type: 'divider' }, { key: 'delete', label: '删除', danger: true }] };
    return h(Space, { size: 4 },
      h(Button, { type: 'link', size: 'small' }, '进入'),
      h(Dropdown, { menu: menu, placement: 'bottomRight', trigger: ['click'] },
        h(Button, { type: 'text', size: 'small', icon: IconDots(), 'aria-label': '更多操作' })));
  }
  function ProjectPanel() {
    var columns = [
      // 批注 round6：列宽分配还原（去掉显式 380 定宽）；fixed 布局保留（撑坏防线）
      { title: '项目', dataIndex: 'name', render: function (_, p) { return ProjectCell(p); } },
      { title: 'SPEC 数', dataIndex: 'spec_count', width: 96, align: 'right', render: function (v, p) { return p.error ? h('span', { className: 'num', style: { color: C.text4, fontSize: 16 } }, '—') : NumCell(v); } },
      { title: '任务进度', dataIndex: 'task_total', width: 220, render: function (v, p) { return p.error ? h('span', { className: 'num', style: { color: C.text4 } }, '—') : ProgressCell(p); } },
      { title: '问题/阻塞', dataIndex: 'problems', width: 108, align: 'right', render: function (v, p) { return p.error ? h('span', { className: 'num', style: { color: C.text4, fontSize: 16 } }, '—') : NumCell(v, v > 0 ? C.red : null); } },
      { title: '活跃运行', dataIndex: 'active_runs', width: 108, align: 'right', render: function (v, p) { return p.error ? h('span', { className: 'num', style: { color: C.text4, fontSize: 16 } }, '—') : NumCell(v, v > 0 ? C.amber : null); } },
      { title: '操作', key: 'actions', width: 116, align: 'right', render: function () { return ActionsCell(); } },
    ];
    var rows = projects.map(function (p) { return Object.assign({ key: p.name }, p); });
    return h('div', { 'data-proto-id': 'overview-project-panel', className: 'bento' },
      h('div', { 'data-proto-id': 'overview-project-toolbar', style: { display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', padding: '14px 20px', borderBottom: '1px solid #f1f5f9' } },
        h('span', { style: { fontSize: 16, fontWeight: 700 } }, '项目清单'),
        h('span', { className: 'num', style: { fontSize: 12, color: C.text4 } }, '共 5 个 · 运行中 2'),
        h('span', { style: { flex: 1 } }),
        h(Input.Search, { placeholder: '搜索项目', size: 'small', allowClear: true, style: { width: 200 } }),
        h(Radio.Group, { optionType: 'button', size: 'small', defaultValue: 'all', options: [{ label: '全部', value: 'all' }, { label: '运行中', value: 'running' }, { label: '未运行', value: 'stopped' }], style: { borderRadius: 10 } })),
      h('div', { 'data-proto-id': 'overview-project-table', className: 'bento-table' },
        h(Table, { columns: columns, dataSource: rows, rowKey: 'key', pagination: false, size: 'middle', scroll: { x: 1060 },
          onRow: function (rec) { return { 'data-proto-id': 'overview-project-row-' + rec.name }; } })));
  }

  function Page() {
    return h('div', { style: { minHeight: '100vh', background: C.bg } },
      h('main', { style: { padding: '24px 24px 40px', maxWidth: 1400, margin: '0 auto' } },
        PageHeader(),
        h('div', { style: { marginTop: 20 } }, AlertCard()),
        h('div', { style: { marginTop: 16 } }, KpiBento()),
        h('div', { style: { marginTop: 16 } }, ProjectPanel())));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(ConfigProvider, { theme: themeConfig }, Page()));
})();
</script>
<script src="annotator.js" defer></script>
</body>
</html>
