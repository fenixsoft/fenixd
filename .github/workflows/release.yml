# fenixd 发布流水线：打 tag（v*）→ 构建 dashboard 产物 → 打包 → Windows 装得动
# 冒烟门 → 全绿才发布 GitHub Release。
# 用户经 install.sh/install.ps1 部署预构建产物，无需本地 Node 环境
# （dist 已不入 git：任何环境的交付件从本环境 src 构建——release 环境的
# "本环境"即本 workflow；源码使用者按 .fenix/verify.yaml prepare 自行构建）。
#
# 冒烟门（v0.1.0 部署实录 §2.2）：打包面缺陷（缺 .fenix 模板/fenixd.py/
# agents/templates——fenix-init 硬读面）曾溜进 v0.1.0 release，fenix-init
# 当场 crash。本流水线先打包、再在 Windows runner 用真制品走 install.ps1 →
# fenix-init 全链，全绿才 publish（smoke 失败 = 不出包）。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 单测守护（code-review item d2264576cec6）：static 单测经 node 原生
  # type-stripping 直载 .ts，需 Node ≥22.18（20.x 直接加载失败）——
  # release 打包前先跑 npm test，回归不过不出包。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/dashboard/static/package-lock.json

      - name: Run dashboard unit tests
        working-directory: core/dashboard/static
        run: |
          npm install --no-audit --no-fund
          npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            core/dashboard/static/package-lock.json
            dsh-bundle/package-lock.json

      - name: Build dashboard（预构建 dist，包内免 Node）
        working-directory: core/dashboard/static
        run: |
          npm install --no-audit --no-fund
          npm run build

      # dsh-bundle 预构建 dist（§7 headless 通道免构建消费）。
      # peer 冲突为已知形态（cordis ~4.0.4 vs dsh-app-boot ~4.1.0），
      # 与手册 §7 注记同款：--force 安装，构建产物以 tsc 输出为准。
      - name: Build dsh-bundle（预构建 dist）
        working-directory: dsh-bundle
        run: |
          npm install --no-audit --no-fund --force
          npm run build
          test -f dist/session-tidy-helper.mjs

      - name: Package（tag 名作版本号，tar.gz + zip + sha256 + 完整性断言）
        run: bash scripts/package.sh "${GITHUB_REF_NAME}"

      - name: Upload dist for smoke & publish
        uses: actions/upload-artifact@v4
        with:
          name: fenixd-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  pack-smoke:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fenixd-dist
          path: pkg

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # install.ps1 硬门需要 claude CLI（python / git runner 镜像自带）
      - name: Install claude CLI (hard gate)
        run: npm install -g @anthropic-ai/claude-code

      - name: Expand artifact
        run: |
          $zip = (Get-ChildItem pkg\fenixd-*.zip | Select-Object -First 1).FullName
          Expand-Archive $zip -DestinationPath C:\smoke

      - name: Run install.ps1（期望 exit 0 且无 WARN 降级）
        run: |
          $dir = (Get-ChildItem C:\smoke -Directory | Select-Object -First 1).FullName
          $log = powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install.ps1" 2>&1 | Out-String
          $log | Set-Content C:\smoke\install.log
          if ($LASTEXITCODE -ne 0) { Get-Content C:\smoke\install.log; exit 1 }
          if ($log -match '\[WARN\]') { Get-Content C:\smoke\install.log; exit 1 }

      - name: fenix-init full-skeleton smoke
        run: |
          $env:PATH = "$env:LOCALAPPDATA\Fenixd\bin;$env:PATH"
          $dir = (Get-ChildItem C:\smoke -Directory | Select-Object -First 1).FullName
          Write-Host "FrameworkRoot: $dir"
          New-Item -ItemType Directory -Force C:\smoke\proj | Out-Null
          Set-Location C:\smoke\proj
          fenix-init . --name smoke --type web
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $checks = [ordered]@{
            config_yaml      = (Test-Path .fenix\config.yaml)
            state_md         = (Test-Path .fenix\STATE.md)
            fenixd_py_link   = ($null -ne (Get-Item .fenix\fenixd.py -ErrorAction SilentlyContinue).Target)
            core_junction    = ($null -ne (Get-Item .fenix\core -ErrorAction SilentlyContinue).LinkType)
            agent_link       = (Test-Path .claude\agents\implementer.md)
            user_config      = (Test-Path $env:USERPROFILE\.fenix\config.yaml)
          }
          $checks | Format-Table -AutoSize | Out-String | Write-Host
          if ($checks.Values -contains $false) { exit 1 }

  publish:
    needs: [release, pack-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fenixd-dist
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fenixd-*.tar.gz
            dist/fenixd-*.zip
            dist/fenixd-*.sha256
          generate_release_notes: true

      # 发版完成后通知 dsh-plugins 仓做插件发布检查（fenix-release-sync）：
      # 有未发版的插件变更则同步打 tag 发版，没有则不变。
      # 需要 fenixd secrets 配置 DSH_PLUGINS_DISPATCH_TOKEN（对 dsh-plugins 仓
      # 有 contents:write 的 PAT；未配置时本步静默跳过，不影响发布）。
      - name: Notify dsh-plugins release check（fenix-released）
        env:
          DISPATCH_TOKEN: ${{ secrets.DSH_PLUGINS_DISPATCH_TOKEN }}
          FENIX_TAG: ${{ github.ref_name }}
        if: env.DISPATCH_TOKEN != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fenixsoft/dsh-plugins/dispatches \
            -d "{\"event_type\":\"fenix-released\",\"client_payload\":{\"fenixd_tag\":\"${FENIX_TAG}\"}}")
          echo "dispatch http=${code}"
          [ "${code}" = "204" ] || echo "::warning::dsh-plugins 发布检查通知失败 http=${code}（不影响 fenixd 本次发布）"
