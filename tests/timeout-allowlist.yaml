# ── 单用例超时豁免清单（add-per-test-timeout-gate）─────────────────────────
# 全局门：pytest.ini timeout=10（signal）。确需超过 10s 的用例必须在下方
# entries 显式登记豁免——豁免必须显式留痕，禁止静默放宽。
#
# schema（三字段均必填；tests/test_timeout_gate.py::TestTimeoutAllowlistSchema
# 机械校验，任一违规即测试失败）：
#   - nodeid:          pytest 完整节点 ID，与 `pytest --collect-only -q` 输出
#                      逐字一致（参数化用例含 [参数] 后缀）
#   - timeout_seconds: 豁免后的单用例超时秒数，正数（>0）
#   - reason:          为何 10s 不够——写明等什么/多长（缺失或为空即违规）
#
# 示例（复制后填真实值，勿原样提交）：
# entries:
#   - nodeid: tests/test_something.py::TestFoo::test_bar
#     timeout_seconds: 30
#     reason: 该用例起真实子进程并等待 20s 排水窗口，10s 不够
entries:
  # 2026-10-08 全量回归自毒化事故（test_run_stop_loss 全局 Popen 补丁泄漏）：
  # 两个判停用例含 3s 观察窗 + AGENT_TERMINATE_GRACE_SECONDS=10s 宽限 join，
  # 正常 2-4s 完成，负载下贴近/越过 10s 全局门（当日实证零号超时源）。
  # 30s 与用例自身 elapsed < GRACE+20 的断言上限同口径。
  - nodeid: tests/test_run_stop_loss.py::TestStallBudgetCriteria::test_polling_loop_kills_stalled_run
    timeout_seconds: 30
    reason: 判停强杀路径含 3s 观察窗与 10s 终止宽限 join，负载下超出 10s 全局门
  - nodeid: tests/test_run_stop_loss.py::TestStallBudgetCriteria::test_polling_loop_disabled_does_not_kill
    timeout_seconds: 30
    reason: 观察窗 3s + cancel 收尾 10s 宽限 join，天然贴近 10s 全局门（2026-10-08 实证超时源）
  # add-dsh-adapter-integration 7.1：端到端冒烟起真实 dsh 0.2.0-rc.2 子进程
  # （DSH_HOME 隔离 + Bundle link 挂载）与 mock 模型端点（node），多轮步骤
  # 脚本往返 + result gate selfcheck 子进程，正常 30-90s，负载下留余量。
  - nodeid: tests/test_dsh_e2e_smoke.py::test_dsh_e2e_smoke_full_chain
    timeout_seconds: 420
    reason: 真实 dsh 子进程启动（Bundle 挂载/隔离 DSH_HOME）+ mock 端点多轮
      往返 + result gate selfcheck 子进程，远超 10s 全局门
  # 2026-11-08 定向重试轮实证超时源（regression-1794123896）：用例起真实
  # DashboardHTTPServer（Registry/静态目录装配）+ 130 条台账种子并全量响应，
  # 空载稳定 2.4s（占 10s 门 1/4）；同轮回归中纯静态扫描用例
  # test_no_bare_getlogger_in_core 同步放大 2.4x（2.14s→5.2s），坐实环境
  # 负载放大而非产品回归。30s 留 ~12x 余量，与 test_run_stop_loss 负载敏感
  # 族同口径。
  - nodeid: tests/test_dashboard_api.py::TestAdminActivitiesServerPaging::test_page_size_capped_at_200
    timeout_seconds: 30
    reason: 真实 HTTP 服务器装配 + 130 条种子全量响应，空载 2.4s，负载下
      回归环境实测放大越门（10.015s），10s 全局门余量不足
  # add-platform-abstraction-layer 7.1 全量回归实证（run5/6/7 三连超时）：
  # 平台守卫 AST 全量扫描（240 个 core/ 文件单遍 parse+walk + 豁免钉计数），
  # 空载 4.3s（已做单遍收集器+进程级缓存收敛），与上方纯静态扫描先例
  # （test_no_bare_getlogger_in_core 2.4x）同族——负载放大非产品回归。
  # 30s 与负载敏感族同口径，留 ~7x 余量。
  - nodeid: tests/test_platform_guard.py::TestPosixFaceBusinessClean::test_no_posix_syntax_faces_outside_pal_linux
    timeout_seconds: 30
    reason: 平台守卫 AST 全量扫描 core/（240 文件），空载 4.3s，全量回归
      负载放大越 10s 门（run5/6/7 三连实证），静态扫描族负载敏感同口径
  # add-platform-abstraction-layer 7.1 全量回归实证（run9）：三车道冒烟起
  # 真实 dsh + node mock 端点子进程（run_smoke 内部 timeout=150s），空载
  # 3.1s，全量负载下子进程启动/端口往返放大越 10s 门——与上方
  # test_dsh_e2e_smoke_full_chain（420s）同族同理由，60s 留 20x 余量。
  - nodeid: tests/test_dsh_acceptance.py::test_smoke_end_to_end_three_lanes
    timeout_seconds: 60
    reason: 真实 dsh + node mock 端点三车道全链（内部超时 150s 口径），空载
      3.1s，全量负载下子进程启动与端口往返放大越 10s 门（run9 实证）
