      h('blockquote', null, '一次立项，闭环交付：需求澄清 → SPEC 评审 → 实现 → 验证 → 裁决 → 合回主树。'),
      h('h2', null, '✨ 特性'),
      h('ul', null,
        h('li', null, '全自动闭环：', h('code', null, '需求 → SPEC → 实现 → 验证 → 合回'), '，全程无人工值守'),
        h('li', null, '多项目并发：优先级队列、依赖唤醒与兜底恢复'),
        h('li', null, '验证管线：场景冻结、裁决证据留存、失败自动修复车道'),
        h('li', null, '知识真相源：', h('a', { href: '#' }, 'spec/knowledge'), ' 按能力域组织项目知识')),
      h('h2', null, '🏗 架构总览'),
      h('pre', null, h('code', null,
        'fenixd/\n' +
        '├── agents/        # Agent 提示词与角色契约（实现/评审/规划）\n' +
        '├── core/          # daemon 核心：调度、验证、裁决、状态机\n' +
        '│   └── dashboard/ # Web 仪表盘（UmiJS + antd）\n' +
        '├── skills/        # Fenix 斜杠命令（/fenix-new、/fenix-prototype…）\n' +
        '├── spec/          # SPEC 真相源（changes / archive / knowledge）\n' +
        '└── tests/         # 验证管线场景与回归用例')),
      h('h2', null, '🚀 快速开始'),
      h('pre', null, h('code', null,
        '# 安装\n' +
        'git clone https://github.com/fenixsoft/fenixd.git && cd fenixd\n' +
        './install.sh\n\n' +
        '# 启动 daemon 与仪表盘\n' +
        'python3 fenixd.py')),
      h('h2', null, '📊 项目状态'),
      h('table', null,
        h('thead', null, h('tr', null, h('th', null, '模块'), h('th', null, '说明'), h('th', null, '状态'))),
        h('tbody', null,
          h('tr', null, h('td', null, '调度车道'), h('td', null, '并发槽位与优先级调度'), h('td', null, h('strong', null, '稳定'))),
          h('tr', null, h('td', null, '验证管线'), h('td', null, '场景生命周期与裁决'), h('td', null, h('strong', null, '稳定'))),
          h('tr', null, h('td', null, '知识真相源'), h('td', null, '能力域知识消费与回填'), h('td', null, h('strong', null, '演进中'))))),
      h('h2', null, '📖 文档'),
      h('ul', null,
        h('li', null, h('a', { href: '#' }, 'DESIGN.md'), '：界面设计宪法'),
        h('li', null, h('a', { href: '#' }, 'docs/help'), '：帮助中心'),
        h('li', null, h('a', { href: '#' }, 'spec/knowledge'), '：知识真相源总目录')));
  }

  /* ── 文件表 ─────────────────────────────────────────────────────── */
  function FileTable(props) {
    var path = props.path, onOpen = props.onOpen, narrow = props.narrow;
    var list = lookup(path);
    var columns = [
      {
        title: '名称', dataIndex: 'name', key: 'name', ellipsis: false,
        render: function (v, r) {
          return h('span', { className: 'fname-cell' },
            Icon(r.dir ? ICON_FOLDER : ICON_FILE, 16),
            h('span', { className: 'fname' }, v));
        }
      },
      { title: '最近提交信息', dataIndex: 'msg', key: 'msg', ellipsis: true, hidden: narrow,
        render: function (v) { return h('span', { className: 'msg-cell' }, v); } },
      { title: '最近提交时间', dataIndex: 'when', key: 'when', hidden: narrow, width: 128,
        render: function (v) { return h('span', { className: 'time-cell' }, v); } }
    ];
    if (!list) {
      return h('div', { className: 'facet-placeholder', 'data-proto-id': 'project-home-empty' },
        h('div', { className: 'big' }, '目录数据未覆盖'),
        '原型假数据未包含该目录（真实现将实时读取项目工作目录）');
    }
    return h(Table, {
      className: 'filetable',
      size: 'middle',
      pagination: false,
      columns: columns,
      dataSource: sortEntries(list).map(function (r) { return Object.assign({ key: r.name }, r); }),
      rowClassName: function (r) { return r.dir ? 'row-dir' : 'row-file'; },
      onRow: function (r) {
        return { onClick: function () { onOpen(r.name); } };
      }
    });
  }

  /* ── 项目首页分面（本 SPEC 新增界面）─────────────────────────────── */
  function HomeTab(props) {
    var path = props.path, setPath = props.setPath, narrow = props.narrow;

    /* path 尾段可能是已点开的文件：拆出 dirPath（目录层级）与 fileEntry（文件行） */
    var dirPath = path.slice();
    var fileEntry = null;
    if (!lookup(dirPath) && dirPath.length > 0) {
      var parent = lookup(dirPath.slice(0, -1));
      var last = dirPath[dirPath.length - 1];
      var hit = parent ? parent.filter(function (r) { return r.name === last && !r.dir; })[0] : null;
      if (hit) { fileEntry = hit; dirPath = dirPath.slice(0, -1); }
    }
    var atRoot = dirPath.length === 0 && !fileEntry;

    function openEntry(name) {
      setPath(dirPath.concat([name]));
    }
    function crumbTo(idx) {
      setPath(path.slice(0, idx + 1));
    }
    function downloadFile() {
      var name = fileEntry.name;
      var blob = new Blob([fileContent(dirPath, name)], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    var breadcrumb = h('div', { className: 'fb-crumb', 'data-proto-id': 'project-home-breadcrumb' },
      dirPath.length === 0 && !fileEntry
        ? h('span', { className: 'cur-root' }, 'fenixd')
        : h(Breadcrumb, {
            items: [{ title: h('a', { onClick: function () { setPath([]); } }, 'fenixd' ) }]
              .concat(path.map(function (seg, i) {
                return {
                  title: i === path.length - 1
                    ? h('span', { className: 'cur-root' }, seg)
                    : h('a', { onClick: function () { crumbTo(i); } }, seg)
                };
              }))
          }));

    var toolbar = h('div', { className: 'fb-toolbar', 'data-proto-id': 'project-home-toolbar' },
      h(Space, { size: 12, wrap: true },
        h(Select, {
          value: 'main', style: { width: 150 }, size: 'small',
          options: [{ value: 'main', label: 'main' }, { value: 'master', label: 'master' }]
        }),
        h(Text, { type: 'secondary', style: { fontSize: 12 } }, '3 个分支 · 12 个标签')),
      h(Text, { type: 'secondary', style: { fontSize: 12 } }, '只读浏览 · 点击文件夹进入子目录，点击文件查看内容'));

    var latest = dirPath.length === 0 && !fileEntry ? h('div', { className: 'fb-latest', 'data-proto-id': 'project-home-latest-commit' },
      h(Avatar, { size: 24, style: { backgroundColor: T.bgSoft, color: T.text2, border: '1px solid ' + T.border2, fontSize: 12 } }, '陈'),
      h('span', { className: 'who' }, LATEST.author),
      h('span', { className: 'what' }, LATEST.msg),
      h('span', { className: 'hash' }, LATEST.hash),
      h('span', { className: 'when' }, LATEST.when)) : null;

    var fileview = fileEntry ? (function () {
      var content = fileContent(dirPath, fileEntry.name);
      var lines = content.split('\n').length;
      var kb = (content.length / 1024).toFixed(1);
      return h('div', { className: 'fileview-box', 'data-proto-id': 'project-home-fileview' },
        h('div', { className: 'fileview-head' },
          Icon(ICON_FILE, 16),
          h('span', { className: 'name' }, fileEntry.name),
          h('span', { className: 'meta' }, lines + ' 行 · ' + kb + ' KB（示例）'),
          h('span', { className: 'acts' },
            h(Button, {
              size: 'small', 'data-proto-id': 'project-home-fileview-download',
              onClick: downloadFile
            }, '下载'))),
        h('div', { className: 'fileview-body' },
          h('pre', null, content)));
    })() : null;

    return h('div', { 'data-proto-id': 'project-home-panel' },
      h('div', { className: 'file-box', 'data-proto-id': 'project-home-filetable' },
        toolbar, latest, breadcrumb,
        h(FileTable, { path: dirPath, onOpen: openEntry, narrow: narrow })),
      fileview,
      atRoot ? h('div', { className: 'readme-box', 'data-proto-id': 'project-home-readme' },
        h('div', { className: 'readme-head' },
          Icon(ICON_FILE, 16), 'README.md', h('span', { className: 'size' }, '4.2 KB')),
        readmeBody()) : null);
  }

  /* ── 功能开发分面（既有界面 mock，默认选中）─────────────────────── */
  var SPECS = [
    { en: 'add-project-home-tab', cn: '项目首页页签（文件与 README）', st: '运行中', tone: T.link, pri: 'P1', prog: '63%', act: '2 小时前' },
    { en: 'add-knowledge-inbox-pipeline', cn: '知识收件箱管线', st: '运行中', tone: T.link, pri: 'P3', prog: '41%', act: '2 小时前' },
    { en: 'add-spec-chinese-title', cn: 'SPEC 中文标题', st: '已完成', tone: T.success, pri: 'P5', prog: '100%', act: '昨天' },
    { en: 'fix-dashboard-read-path-performance', cn: '仪表盘读取性能修复', st: '已完成', tone: T.success, pri: 'P2', prog: '100%', act: '3 天前' },
    { en: 'blocked-disposition-display', cn: 'blocked 处置相位显示', st: '已完成', tone: T.success, pri: 'P4', prog: '100%', act: '4 天前' },
    { en: 'add-spec-manual-activation', cn: 'SPEC 手工激活档', st: '已归档', tone: T.text4, pri: 'P5', prog: '100%', act: '1 周前' }
  ];
  function DevTab() {
    return h('div', { 'data-proto-id': 'project-home-devtab' },
      h('div', { className: 'devtab-filter' },
        h(Input, { placeholder: '搜索 SPEC 名称…', style: { width: 260 } }),
        h(Select, { defaultValue: 'all', style: { width: 130 }, size: 'middle',
          options: [{ value: 'all', label: '状态：全部' }, { value: 'running', label: '运行中' }, { value: 'done', label: '已完成' }] }),
        h(Select, { defaultValue: 'all', style: { width: 130 },
          options: [{ value: 'all', label: '类型：全部' }, { value: 'feature', label: 'feature' }, { value: 'fix', label: 'fix' }] }),
        h('span', { className: 'count' }, '共 6 个 SPEC（示例）')),
      h(Table, {
        size: 'middle', pagination: false,
        dataSource: SPECS.map(function (r, i) { return Object.assign({ key: i }, r); }),
        columns: [
          { title: 'SPEC', dataIndex: 'en', key: 'en',
            render: function (v, r) {
              return h('div', { className: 'spec-name-cell' },
                h('div', { className: 'en' }, v),
                h('div', { className: 'cn' }, r.cn));
            } },
          { title: '状态', dataIndex: 'st', key: 'st', width: 110,
            render: function (v, r) {
              return h('span', { className: 'status-cell' },
                h('span', { className: 'dot', style: { backgroundColor: r.tone } }), v);
            } },
          { title: '优先级', dataIndex: 'pri', key: 'pri', width: 90,
            render: function (v) { return h('span', { className: 'num-cell' }, v); } },
          { title: '进度', dataIndex: 'prog', key: 'prog', width: 90,
            render: function (v) { return h('span', { className: 'num-cell' }, v); } },
          { title: '最近活动', dataIndex: 'act', key: 'act', width: 120,
            render: function (v) { return h('span', { className: 'time-cell' }, v); } }
        ]
      }));
  }

  function FacetPlaceholder(props) {
    return h('div', { className: 'facet-placeholder', 'data-proto-id': 'project-home-facet-' + props.id },
      h('div', { className: 'big' }, props.label),
      '既有分面 · 原型范围外（保持现状）');
  }

  /* ── 页面骨架 ───────────────────────────────────────────────────── */
  function App() {
    var st = React.useState({ tab: P0.tab || 'dev', path: P0.tab === 'home' ? P0.path : [] });
    var state = st[0], setState = st[1];
    var vp = React.useState(window.innerWidth);
    var vw = vp[0], setVw = vp[1];
    React.useEffect(function () {
      var fn = function () { setVw(window.innerWidth); };
      window.addEventListener('resize', fn);
      return function () { window.removeEventListener('resize', fn); };
    }, []);
    var narrow = vw < 768;

    function setTab(tab) {
      setState({ tab: tab, path: state.path });
      writeParams({ tab: tab });
    }
    function setPath(path) {
      setState({ tab: 'home', path: path });
      writeParams({ tab: 'home', path: path });
    }

    var items = [
      { key: 'home', label: '项目首页',
        children: h(HomeTab, { path: state.tab === 'home' ? state.path : [], setPath: setPath, narrow: narrow }) },
      { key: 'dev', label: '功能开发', children: h(DevTab, null) },
      { key: 'quality', label: '代码审查', children: h(FacetPlaceholder, { id: 'quality', label: '代码审查' }) },
      { key: 'regression', label: '测试回归', children: h(FacetPlaceholder, { id: 'regression', label: '测试回归' }) },
      { key: 'architecture', label: '架构蓝图', children: h(FacetPlaceholder, { id: 'architecture', label: '架构蓝图' }) },
      { key: 'knowledge', label: '项目知识', children: h(FacetPlaceholder, { id: 'knowledge', label: '项目知识' }) }
    ];

    return h(ConfigProvider, {
      theme: {
        token: {
          colorPrimary: T.primary, colorPrimaryHover: T.primaryHover, colorPrimaryActive: T.primaryActive,
          colorLink: T.link, colorInfo: T.link, colorSuccess: T.success, colorError: T.error, colorWarning: T.warning,
          colorText: T.text, colorTextSecondary: T.text2, colorTextTertiary: T.text3, colorTextQuaternary: T.text4,
          colorBgLayout: '#ffffff', colorBorder: T.border, colorBorderSecondary: T.border2, colorSplit: T.split,
          fontFamily: T.font, controlHeight: 32
        }
      }
    }, h('div', { className: 'proto-page' },
      h('div', { className: 'proto-titlebar', 'data-proto-id': 'project-home-pagetitle' },
        h('button', { className: 'back-btn', title: '返回总览' }, Icon(ICON_BACK, 18)),
        h('span', { className: 'proj-name' }, 'fenixd'),
        h('span', { className: 'proj-sub' }, '共 ', h('span', { className: 'num' }, '42'), ' 个 SPEC')),
      h(Tabs, {
        'data-proto-id': 'project-home-tabs',
        activeKey: state.tab,
        onChange: setTab,
        items: items
      }),
      h('div', { className: 'proto-footer', 'data-proto-id': 'project-home-footer' },
        '原型说明：默认进入「功能开发」页签（既有行为保持）；URL 支持 ?tab=home&path=core/dashboard 复现状态。全部数据为内联假数据。')
    ));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
})();
</script>
<script src="annotator.js" defer></script>
</body>
