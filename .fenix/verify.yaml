# =============================================================================
# .fenix/verify.yaml — 声明式验证契约
# =============================================================================
#
# 【本文件的作用】
# 「最终用户验证」必须测"被测实现 fresh 构建出的可运行形态"。本文件向框架
# 声明三件事：应用如何构建（prepare）、如何被服务成可访问实例（serve）、
# 何时算就绪（ready）。框架在每轮验证前按序执行，并把验证场景的 URL 全量
# 改写到本次启动的实例——保证场景永远打新鲜实现，而不是 planner 臆测的
# 地址或上一次构建的陈旧产物。
#
# 没有本文件的项目：框架回退旧行为（config 的 commands.start + 端口改写），
# 存量项目零迁移；但没有构建声明的构建型应用会在合并后测到陈旧产物。
#
# 【字段说明】（完整权威文档见 core/verify_contract.py 模块注释）
#
# prepare   可选。构建步骤列表，验证前在项目根逐条执行：
#   - run   必填。字符串=经 shell 执行；YAML 列表=argv 直接执行
#   - cwd   可选。相对项目根的工作目录，缺省=项目根
#
# serve     可选。被测实例的启动方式；缺省回退 commands.start（旧行为）
#   kind    static=框架内置静态服务器（服务 root 目录，自动分配端口）
#           command=启动长驻服务命令（形态同 commands.start，项目根为 cwd）
#   root    kind=static 必填。URL 空间的根目录（相对项目根）——注意取的
#           是"路径前缀成立"的目录：本应用以 / 访问，故 root 取
#           core/dashboard/static（dist 的父目录）而非 dist 本身
#   cmd     kind=command 必填。服务启动命令；端口写 {port} 占位符——框架
#           启动前分配空闲端口替换，并同值导出 FENIX_VERIFY_PORT 环境变量
#           （实例永不与既有实例争抢端口，主树常驻 8787 不受影响）
#   port    kind=command 可选。legacy 端口提示（仅未迁移契约的邻近扫描
#           兜底用；cmd 引用 {port} 后无需再填）
#
# ready     可选。就绪探针；缺省探实例根路径、期望 200、等待 60 秒
#   url     探针路径（相对被测实例）。SPA 应用禁止探会被 fallback 兜底的
#           路径——框架在探针通过后做鉴别力自检（随机不存在路径响应与探针
#           完全一致＝探针无鉴别力），命中即判就绪失败并给处方
#   expect  期望 HTTP 状态码
#   timeout 就绪等待上限（秒）
#
# 【铁律】验证场景的 URL 由框架注入改写（BASE_URL），场景编写者与 planner
# 不需要（也不应该）硬编码实例地址。
# =============================================================================

prepare:
  - run: npm install --no-audit --no-fund
    cwd: core/dashboard/static
  - run: npm run build
    cwd: core/dashboard/static
  # serving worktree 内缺 .fenix（gitignore 不随 git）——链入主树运行态，
  # 使命令型实例与常驻 dashboard 同等保真（worktree 作用域下 cwd 在三层
  # 子目录，恰好指回项目根）；主树执行时 .fenix 已存在，此步自然跳过
  - run: test -e .fenix || ln -s ../../../.fenix .fenix
  # admin 修 2026-09-06（add-spec-scheduling-controls 第 1 轮 13 场景 env 阻塞）：
  # 冻结场景集假设被测实例可见夹具项目 scheduling-showcase（8 个特定状态
  # spec），但 serve.cmd 只启动 dashboard、无夹具供给——夹具缺失即 api 场景
  # 404 unknown project、web 场景无行可点。本步每轮验证前幂等重建/复位夹具
  # 并确保注册表登记（场景会真实改写夹具 STATE.md，跨轮持久故须复位）。
  # 2026-09-14 夹具入库：稳定骨架（scheduling_showcase 包/tests/pyproject）
  # 入库于 tests/fixtures/scheduling-showcase/，本步从骨架 provision 到运行时
  # /root/scheduling-showcase（仓外——运行时会被 seed 与夹具 daemon 写入，不能
  # 落 fenixd 跟踪路径）；夹具原独立 git 已丢历史，reset 时 git init 新建。
  # 主路径 = worktree 内 git 跟踪的 bin/ 脚本；fallback = .fenix/bin 运行态
  # 副本（覆盖 worktree 落在旧提交、尚无该脚本的窗口）。
  - run: python3 bin/fixture_scheduling_showcase.py --reset || python3 .fenix/bin/fixture_scheduling_showcase.py --reset

serve:
  # command + static_scope=worktree：serving worktree 内起真实全栈实例
  # （Python API + 本次构建的前端产物）——static 模式无 API，交付物端点
  # 会被迫 mock（假阴性放大器，help-center 实证）
  # 端口写 {port} 占位符：框架启动前分配空闲端口替换（并同值导出
  # FENIX_VERIFY_PORT 环境变量）——实例永不与主树常驻实例争抢 8787
  kind: command
  cmd: python3 bin/fenix_dashboard.py --serve --port {port}

ready:
  # admin 修 2026-09-06（add-spec-hooks 第 1 轮 4 个 web 场景白屏 env 阻塞）：
  # 就绪探针禁用 / —— SPA fallback 对任意路径（含 /）在 HTTP 服务一监听时就
  # 回 200，探针同秒通过而应用后端初始化/前端产物可用性未发生（日志实证：
  # 探针通过与 16 场景开跑同一秒），冷实例被打进断言窗口＝白屏伪失败。
  # 改探真实 API 端点（等价 dashboard 探活双重校验的 API 半边）。
  # 勘误 2026-09-06（探针鉴别力自检落地时实测）：server 对未知路径回 404、
  # 并无 SPA fallback——同秒通过的真实机制是「监听即服务静态壳」（/ 恒 200
  # 无需 fallback）；白屏根治靠 browser.py 首帧渲染等待（42bdf8f），本探针
  # 改 API 端点语义上仍更诚实（探活后端而非静态壳）。
  # 换端点 2026-09-12（fix-supervisor-hosting-chain / fix-dashboard-fault-isolation
  # 验证环境阻塞）：原探针 /api/projects 的成本随 .fenix/runs/ 产物量线性增长
  # ——project_summary → get_runs 每次请求都全量重读重解析 runs 顶层所有 jsonl
  # （实测 413 文件 / 481MB 时：冷实例 8-11s、稳态 2.4s），而 probe_ready 单次
  # 请求硬编码 urlopen(timeout=3)，于是每次尝试必超时 → 120s 预算耗尽 →
  # 就绪失败 fail-fast。改探 /api/alerts：无参时跨项目聚合告警，仍走真实后端
  # 数据路径（项目发现 + 逐项目读告警文件），成本与 runs 产物量无关，实测主树
  # 与 serving worktree 均 0.01s；未知路径回 404，鉴别力自检照常通过。
  url: /api/alerts
  expect: 200
  timeout: 60

# regression 段（admin 补 2026-09-21，verify_regression_missing 信号）：
# 项目测试体系 = pytest（tests/ 下 241 个 test_*.py，conftest.py collect_ignore_glob
# 已排除 fixtures 夹具套件）。全量回归实测 5297 用例 / 254s，故 timeout_seconds
# 设 1800（7 倍余量）。cmd 走 pytest 原生 --junit-xml 产出 JUnit XML。
regression:
  cmd: python3 -m pytest tests/ -q --junit-xml=.fenix/regression/junit.xml
  output: .fenix/regression/junit.xml
  format: junit
  timeout_seconds: 1800
  # 长耗时用例阈值项目级收紧为 5s（2026-09-25；代码缺省 8 不动）。test_
  # artifact_paths_declaration 的 walk 剪枝治理后已落 2s 级，5s 口径让
  # 5s+ 用例进回归页签长耗时表。
  long_test_threshold_seconds: 5
