<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fenix Dashboard</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/vendor/fenix.bundle.css" />
  </head>
  <body class="fenix-dashboard">
    <header class="topbar">
      <div class="brand">🐉 Fenix<span class="brand-sub">Dashboard</span></div>
      <nav class="nav">
        <button id="btn-overview" class="nav-btn">概览</button>
        <select id="project-select" title="切换项目（空 = 概览）"></select>
        <button id="btn-activities" class="nav-btn">运维记录</button>
        <button id="btn-config" class="nav-btn">配置</button>
      </nav>
    </header>

    <!-- 人工升级告警横幅（未处理时显示，可展开列表） -->
    <div id="alert-banner" class="alert-banner hidden"></div>

    <main id="main">
      <div class="empty-state">加载中…</div>
    </main>

    <div id="lightbox" class="lightbox hidden"><img id="lightbox-img" alt="截图预览" /></div>

    <!-- 运行记录弹窗（80% 屏宽/高） -->
    <div id="runmodal" class="runmodal hidden">
      <div class="runmodal-box">
        <div class="runmodal-head">
          <span id="runmodal-title" class="runmodal-title"></span>
          <button id="runmodal-close" class="modal-close" title="关闭">✕</button>
        </div>
        <div class="runmodal-body" id="runmodal-body"></div>
      </div>
    </div>

    <!-- SPEC 文档弹窗（复用 runmodal 视觉，独立 docmodal 语义；三页签承载背景/设计/任务清单） -->
    <div id="docmodal" class="runmodal hidden">
      <div class="runmodal-box">
        <div class="runmodal-head">
          <span id="docmodal-title" class="runmodal-title"></span>
          <button id="docmodal-close" class="modal-close" title="关闭">✕</button>
        </div>
        <div class="docmodal-tabs">
          <button class="doc-tab-btn" data-doc="proposal">需求背景</button>
          <button class="doc-tab-btn" data-doc="design">详细设计</button>
          <button class="doc-tab-btn" data-doc="tasks">任务清单</button>
        </div>
        <div class="runmodal-body" id="docmodal-body"></div>
      </div>
    </div>

    <script src="/vendor/fenix.bundle.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
