# Fenix Loop Engineering Framework Configuration
# ================================================
# This file controls all aspects of the fenixd daemon and its Agents.
# Modify values to adapt the framework to your project.
#
# 该模板由 `fenix-init` 生成项目配置时渲染；
# {{PROJECT_NAME}} 与 {{PROJECT_TYPE}} 会被替换为实际项目名/类型。

# ---- Project Identity ----
project:
  name: "{{PROJECT_NAME}}"           # Project name (used in reports)
  type: "{{PROJECT_TYPE}}"           # web | cli | library | api
  root: "."                       # Project root relative to .fenix/
  # description: ""              # 项目简介，由 fenix-setup 自动生成，可在 Dashboard 修改

# ---- Scheduling ----
schedule:
  # Interval (minutes) for periodic full-state scan as fallback
  poll_interval_minutes: 30
  # Time of day for daily report generation (HH:MM, 24h format)
  daily_report_time: "09:00"
  # 注：schedule.stuck_threshold_minutes 已弃用。stuck 判定阈值改为由
  # agents.run_timeout_seconds 单源派生（run_timeout + 600s 宽限），旧键不再生效。
  # 此处不再保留该配置行，避免与超时参数再次手工漂移脱钩。

# ---- LLM Provider 注册表（可选）----
# 定义多个 LLM Provider，供 agents.models 引用。
# 未配置时所有 Agent 使用默认环境变量模型（现状行为）。
# llm:
#   providers:
#     - name: "volc-engine"            # 唯一标识，被 agents.models 引用
#       baseurl: "https://api.example.com/v1"
#       apikey: "sk-xxx"               # 敏感信息，.fenix/config.yaml 已 gitignore
#       model: "deepseek-v4-flash"     # 该 Provider 的默认模型名（实际发给网关的模型名）

# ---- Agent Harness（agent 进程边界选型；add-harness-adapter-layer 6.1）----
# 注意区分两个顶层段，勿混用：
#   agent  （本段，单数）——harness 进程边界选型：spawn 的 agent 进程由哪个
#                          harness 适配层驱动（进程边界协议：argv/env/stdin
#                          构造与事件归一化）。
#   agents （下方既有段，复数）——per-agent 行为配置：max_concurrent、
#                          impl_run_budget、timeout_overrides、退避段等，
#                          与 harness 选型正交。
# agent:
#   # harness 进程边界实现。合法值 claude|dsh：
#   #   claude —— Claude Code CLI（缺省，现状行为）
#   #   dsh    —— 另一 harness 实现（尚未部署；dispatch 前置健康检查会
#   #             fail-fast「dsh adapter 未部署」，设置页保存也会被拦）
#   # 非法值回退 claude 并告警；修改后约 30s 热更新对下次 dispatch 生效，
#   # 在飞 run 不受影响。
#   harness: claude

# ---- Agent Configuration ----
agents:
  # per-agent 环境变量注入（agents.agent_env.<agent-type>: {ENV: value}）：
  # 仅作用于对应 agent-type 的 spawn 进程（含其 Task 子代理），不波及其他车道。
  # 例：agents.agent_env.code-fix.MAX_THINKING_TOKENS: '1024' 压缩 thinking 预算。
  # agent_env:
  #   code-fix:
  #     MAX_THINKING_TOKENS: '1024'
  # 并行度：同时运行的 Agent 进程数上限。
  # 调度采用严格优先级并行：高优先级（priority 数值小）先执行；
  # 同一优先级内的任务可并行至该上限；不同优先级不并行
  # （低优先级等高优先级全部完成后才启动，不抢占已在运行的任务）。
  # 推荐值 5（add-pipeline-throughput-governance D1，与代码缺省值一致）。
  # 上调前的资源前提自查：
  #   * worktree 磁盘：每个并发实现 run 一个独立 worktree，约 N × 仓库大小，
  #     确认剩余空间充足再上调；
  #   * 网关并发压力：N 路并发 run 会放大模型网关的并发请求与长尾，
  #     网关侧瞬断熔断与 failover 已有治理兜底，但配额需自行确认；
  #   * 回归锁串行化：多 run 同时到达收尾回归检查点时由 full-suite.lock
  #     主机级互斥串行执行（等待上限 600s、超时 skip），并发上调不改变
  #     回归互斥语义，只增加锁排队。
  # 显式配置优先级高于代码缺省值；随时可人工调回任意值（如 3）即时生效。
  max_concurrent: 5
  # Maximum retry attempts for a failed Agent run
  max_retries: 3
  # 实现尝试总预算（add-fail-counter-budget D2/D3）：每 spec 跨修复周期的实现
  # run 启动次数上限（含首次实现与每轮修复重派、含单次派发的重试 attempt）。
  # 达到预算 → 状态 blocked + 人工裁决告警，不再自动重派，需人工处置。
  # 合法范围 1 至 agents.impl_run_budget_max（缺省 100）。留空/注释即采用缺省值 4。
  # 修改后约 30s 配置热更新生效。
  impl_run_budget: 4
  # 实现尝试预算的可配置上限（open-impl-budget-ceiling）：per-spec 覆盖值与
  # agents.impl_run_budget 均按此上限夹紧。旧实现硬编码 1-10，对长链条 spec 过紧
  #（机制摩擦吃满预算后真修复轮次归零）。缺省 100；硬天花板 1000。
  impl_run_budget_max: 100
  # 同因重派熔断阈值（fix-redispatch-loop-governance D3/D5）：同一 spec 连续以
  # 同一归因（归一化指纹：剔除 run_id/时间戳/worktree 路径后的失败文案）判失败
  # 重派达该阈值 → 冻结转人工（status=blocked + frozen + redispatch_loop_detected
  # 人工升级告警），不再自动重派——替代「清零重试计数后照样重派」的空转
  #（2026-09-17 fix-robustness-edge-cases 事故：同 spec 同终局热派 3 轮、
  # 每轮 ~$18、首轮整支丢弃）。每轮原因都在变化时不累积，不会误熔断真实需要
  # 多轮修复的 spec。合法范围 1-100；留空/注释即采用缺省值 3。
  # 修改后约 30s 配置热更新生效。设置界面在「预算」页签。
  max_same_cause_redispatches: 3
  # fast-track 派发前规模预检（add-fast-track-scale-precheck；2026-09-17 改版）。
  # 算分：未勾选任务数 ×1 + tasks.md 声明段交付物数 ×2（交付物 = kind ∈
  # modify/new/delete 的条目；reference 不计）。分值分档（严格大于）：
  #   分值 ≤ higher_threshold            → normal（按原 fast-track 档派发）
  #   higher_threshold < 分值 ≤ full_threshold → higher（提高 extension 上限，仍走 fast-track）
  #   分值 > full_threshold              → full（.spec.yaml mode 改写为 full，改走完整模式）
  # enabled 为总开关：关闭后预检完全不执行（既不提高 extension 预算也不降级）。
  # 两阈值须为正整数且 higher_threshold < full_threshold，否则整段回退缺省。
  # 修改后约 30s 配置热更新生效。设置界面在「预算」页签。
  scale_precheck:
    enabled: true
    higher_threshold: 30
    full_threshold: 45
  # 单 spec 累计 input token 预算（add-cost-observability D5，单位：百万）。
  # 收工累计达到 80% 发提醒级告警、100% 发升级级告警（不自动冻结，由人工决定处置）。
  # 合法范围 0-1000；设为 0 表示关闭预算检查。留空即采用缺省值 50。
  token_budget_millions: 50
  # Maximum turns per Agent invocation (claude -p --max-turns)
  # 默认 400：单次 Agent 运行轮次上限（覆盖旧默认值 50/150/300）。该值为「上限」而非目标，
  # 超时/强杀保护仍在；对 32 场景级别验证为合理预算。
  max_turns: 400
  # Daily limit on total Agent runs (0 = unlimited)
  daily_run_limit: 300
  # Timeout in seconds for a single Agent run
  run_timeout_seconds: 9000
  # fix-agent-lane-efficiency D1：子代理模型覆盖（subagent model override）。
  # 非空时，直连 Provider 车道下隔离 settings.json 的 env 子代理 tier 映射
  # （CLAUDE_CODE_SUBAGENT_MODEL / ANTHROPIC_DEFAULT_{OPUS,SONNET,HAIKU}_MODEL）
  # 使用该值而非 provider 自身 model。空串（缺省）= 使用 provider model。
  # 注意：已弃用的 agents.subagent_model 为死键（无读点），不生效。
  # subagent_model_override: ""
  # run_timeout 按 agent_type 覆盖（per-agent-timeout-override）：键 ∈ 全部七类
  # agent run（implementer/verifier/planner-plan/planner-judge/fast-track/repair/
  # administrator）+ supervision-judge；agent run 值须为 ≥300 整数，supervision-judge
  # 为 ≥1 整数。非法键值整条忽略（回退全局 run_timeout_seconds）并打 ERROR，其余合法键
  # 正常生效；supervision 的 extension 总额与 absolute_max 护栏按覆盖后生效值派生，
  # stuck 阈值派生保持全局默认值语义。缺省（不配置）时零行为变化。
  timeout_overrides:
    # planner-plan: 2700
    # supervision-judge: 120

  # 超时活性监督（improve-run-lifecycle-governance D3）。run 到达
  # run_timeout_seconds 不再直接 kill，而是按下方矩阵判定是否续期：
  #   1. 总墙钟 ≥ absolute_max_seconds → 无条件终止（封闭续期的成本风险）；
  #   2. 已续期 max_extensions 次 → 终止；
  #   3. judge_window 秒内零 run 事件 → 跳过 LLM、直接判停滞终止；
  #   4. LLM 判定 advancing（单轮轻量判定）→ deadline += extension_seconds 续期，
  #      并同步顺延 stuck 检测基准；判定 stagnant / judge 不可用 → 终止留证。
  # enabled: false 退回纯墙钟超时（现状行为）。
  # 注：canonical 位置在 agents.timeout_supervision；旧顶层 timeout_supervision
  # 键（enabled: false）仅作回退开关，两处同时配置时以本段为准。
  timeout_supervision:
    enabled: true
    # 单次续期秒数
    extension_seconds: 1800
    # 续期次数上限（0 = 到点即按活性判定终止，不续期）
    max_extensions: 2
    # 总墙钟上限（秒）。下限约束（supervision-timeout-config-consistency）：
    #   absolute_max_seconds MUST ≥ max(全局 run_timeout_seconds, agents.timeout_overrides 全部值)
    #     + (max_extensions + 2) × extension_seconds
    # （+2 覆盖 fast-track higher 档续期预算加成；配置校验层按「全部署最大可达
    # 下限」取保守值，派生实现见 core/config.py supervision_config_floor）。
    # 低于下限时：默认自动对齐抬升并持久化（auto_align 显式关闭则启动/热更新
    # fail-fast）。示例 16200 = 9000 运行 + 4×1800 续期（= 现有取值，向下兼容）。
    # 提示：仅按 2×1800 基础预算（如 12600）会让 fast-track higher 档运行时再次
    # 命中同文案 ERROR，「消除 ERROR 复发」目标落空，MUST NOT 下调保守性。
    absolute_max_seconds: 16200
    # 活性判定窗口（秒）：窗口内零事件直接判停滞；judge 的快照也取此窗口
    judge_window: 600
    # 一致性校验处置（可选）：absolute_max_seconds < 配置校验层下限时，
    # true（缺省）= 自动抬升至下限并持久化；false = 启动/热更新 fail-fast。
    # auto_align: true
  # 使用三步验证流水线（Planner → VerifyEngine → Judge），比旧版 verifier 快 5-10x
  use_new_verifier: true

  # 瞬断治理（fix-provider-transient-backoff D6）：provider 网关瞬时故障（model 拒绝 /
  # 5xx / 断连）的退避与熔断策略。非法值自动回退缺省，配置后约 30s 配置热更新生效。
  #
  # 原地退避秒序列（逗号分隔，长度=单 attempt 内原地重试上限）。缺省 30,60,120 表示
  # 瞬断首败原地等 30s 重试、再败等 60s、再败等 120s；耗尽才走换链逻辑。留空 "" 关闭
  # 原地退避（回退到既有换链行为）。
  transient_backoff_schedule: "30,60,120"
  # dispatch 层瞬断终态排程等待秒数：`[provider-transient]` 标记失败后延迟重派，
  # 不写 retries exhausted。缺省 600（10 分钟，历史死亡 run 重派 16 分钟后成功）。
  transient_redispatch_delay_seconds: 600
  # 全局同错误指纹熔断阈值：窗口内同一错误指纹出现次数达此值触发全局派发冻结。
  # 设为 0 关闭熔断。缺省 3。
  transient_break_threshold: 3
  # 熔断滑动窗口秒数。缺省 600。
  transient_break_window_seconds: 600
  # 熔断冷却秒数：触发后全局冻结新 run 派发的时长。缺省 600。
  transient_break_cooldown_seconds: 600

  # 按 Agent 角色分配模型（可选）。未列出的角色使用默认模型。
  # 角色可选: implementer | planner-plan | planner-judge | verifier | administrator | self-review | fast-track | code-review | code-fix | arbiter
  # arbiter 为全局决策者车道（add-arbiter-lane）：冻结/升级事件自动派发的跨
  #   车道验尸者。未分配时钉死 bigmodel/glm-5.3-flash（不回落默认网关——
  #   官方模型别名链在网关侧易踩 [1M] 别名拒绝）。
  # self-review 为每日自省与框架自进化（evolution）共用的分配。
  # code-review 为周期性仓库级代码审查（add-code-review-agent-and-quality-tab）：
  #   模型链回退 code-review → self-review → administrator → 默认网关。
  # code-fix 为审查台账自动修复（add-code-review-auto-fix）：缺省与 code-review
  #   同源，模型链回退 code-fix → code-review → self-review → administrator → 默认网关。
  #
  # provider 支持三种形态（逐字节向后兼容）：
  #   形态 1（字符串）：单值链，角色级 model 或 provider 条目 model 作为缺省。
  #     implementer:
  #       provider: "volc-engine"
  #       model: "deepseek-v4-flash"
  #
  #   形态 2（字符串数组）：按序候选链，元素级 model 均回退角色级或 provider 条目。
  #     implementer:
  #       provider: ["volc-engine", "aliyun"]
  #       model: "deepseek-v4-flash"
  #
  #   形态 3（对象数组）：每个元素可携带独立 model（跨供应商场景必需）。
  #     实现者 roles:
  #       provider:
  #         - provider: "inferaiapi.com"
  #           model: "deepseek-v4-flash"    # 该元素专用模型名
  #         - provider: "bigmodel.cn"
  #           model: "glm-5.3-flash"
  #
  # 混合形态（str|对象在同一数组中）也允许：
  #   provider:
  #     - provider: "inferaiapi.com"
  #       model: "deepseek-v4-flash"
  #     - "aliyun"                          # 回退角色级 model（若已提供）
  #
  # model 解析顺序（design D1）：元素自带 model > 角色级 model > providers 条目 model。
  # 三者皆空的元素在运行期被跳过（ERROR 日志记录元素下标，不阻塞加载）。
  # 角色级 model 不再要求非空（design D2），语义为全链缺省。
  #
  # 拒模型链卫生（add-impl-selfcheck-model-probe）：链条目里的 (provider, model)
  # 若被该 provider 明确拒绝（unrecognized_model），属确定性失败——每次派发都会
  # 撞同一拒绝。runner 会记 WARNING（Unrecognized model rejected by provider），
  # 全链候选均被拒时失败归因带 [model-chain-unavailable] 标记且不自动重派。
  # 应人工从运行时 .fenix/config.yaml 各链摘除该条目（摘除/恢复步骤见
  # docs/help/12-faq.md），并在 .fenix/todo.md 登记提醒。
  # models:
  #   implementer:
  #     provider: "volc-engine"
  #     model: "deepseek-v4-flash"
  #   planner-plan:
  #     provider: "volc-engine"
  #     model: "deepseek-v4-pro"
  #   code-fix:
  #     provider: "volc-engine"
  #     model: "deepseek-v4-flash"
  #   arbiter（add-arbiter-lane：全局决策者车道，建议直连 bigmodel）:
  #     provider: "bigmodel.cn"
  #     model: "glm-5.3-flash"

# ---- Worktree Configuration ----
worktree:
  # Base directory for git worktrees
  base_dir: ".claude/worktrees"
  # merge 前置预检逃生门（add-pipeline-throughput-governance 2.3）：true 时
  # 跳过 merge-back 的 WIP 重叠预检直接 merge（紧急推送用），冲突时按既有
  # 失败路径处理。缺省 false——缺省预检行为 =「主树 WIP 未提交改动 ∩ 分支
  # 触碰文件」非空即拦截并升级人工（spec 保持可重试，不发起 merge）。
  merge_precheck_bypass: false
  # Branch prefix for implementer worktrees
  implement_branch_prefix: "fenix"
  # Branch prefix for verifier worktrees
  verify_branch_prefix: "fenix/verify"
  # 构建产物路径（evo-merge-back-wip-artifact-scope D2 /
  # fix-artifact-paths-hardcoded-default D1）：声明项目的构建产物路径，供产物
  # 判定器识别并从 merge-back 的 WIP 重叠集合中排除（对齐 HEAD）。判定完全由
  # 配置驱动，代码中无任何内置默认路径——未配置时判定恒假（未裁决）。
  # 支持两类形态（字符串列表）：
  #   - 目录前缀：不含 *、必须以 / 结尾（如 "dist/"、"build/"）——路径以该串
  #     开头即判定为产物；前缀未以 / 结尾会被静默丢弃（防 dist 误匹配 dists/）
  #   - 文件通配：含 *（如 "release-*.zip"）——按 fnmatch.fnmatchcase 匹配
  #     完整相对路径（不含 / 的模式只匹配仓库根级文件，不会跨目录命中子目录同名文件）
  # 非法项（非字符串、绝对路径、含 .. 段）被丢弃并记 WARNING；全部非法/为空列表
  # → 回退空集合（判定恒假）。
  # 项目是否存在构建产物（三态）：
  #   - 缺省（未配置）= 未裁决：仅当 build_artifact_paths 非空时按路径判定，
  #     否则判定恒假，且 merge-back 会写入 build_artifact_paths_missing 信号
  #     呼叫 Administrator 起草（也可由 fenix-setup 自动探测填写）
  #   - false = 已声明无产物：判定恒假，不再触发起草
  #   - true = 按 build_artifact_paths 判定（该键为空时仍视为未裁决需起草）
  # 示例（产物在仓库根的项目，如 vite + zip 发布包）：
  #   has_build_artifacts: true
  #   build_artifact_paths: ["dist/", "build/", "release-*.zip"]
  # has_build_artifacts: true
  # build_artifact_paths: ["dist/", "build/", "release-*.zip"]

  # ── 已合并分支 GC（add-merged-branch-gc）─────────────────────────
  # 每轮 daemon 启动清扫回收满足全部安全条件的 fenix/* 分支：已完全并入
  # 基线分支（git branch -d 语义，未合并分支天然免疫）、tip 提交时间早于
  # 宽限期、未被任何 worktree checkout、所属 spec 非活跃（implementing /
  # implemented / testing / reviewing / ready+_recovery_resume /
  # blocked+frozen_hold 均豁免）。
  branch_gc:
    # 分支 GC 总开关（缺省 true）：false 时整个 GC 环节跳过，行为与引入
    # GC 之前完全一致（不扫描、不删除、无日志）。
    enabled: true
    # 宽限期天数（缺省 7，最小 1）：分支 tip 提交时间需早于该宽限期才会被
    # 回收。宽限期保护合并后流程中的分支读取窗口（deliverables D1 读侧
    # 兜底 git show <branch>:tasks.md、验证 diff 参照），窗口滑到 main 后
    # 读取结果等价。0/负数/非整数按非法值处理，回退默认 7。
    retention_days: 7

# ---- Gate Configuration ----
gates:
  # The ONLY human gate: push approval
  # All other stages are fully automated
  require_push_approval: true

  # 审批模式: manual（默认，人工审批） | auto（done 后自动 push）
  # auto 模式下 SPEC 到达 done 后 daemon 会自动 git push 并推进到 pushed 状态
  approve_mode: "manual"

# ---- Verify Contract ----
verify:
  # static 验证契约（.fenix/verify.yaml）的服务范围：
  #   main（默认，方案 1）— 在主树构建并起被测实例；实现合并后产物必然新鲜
  #   worktree（方案 2）— 在专用 serving worktree 内构建并起服务，隔离主树
  #     运行实例（每次 HEAD 变化自动重建 worktree 与产物，node_modules 自动
  #     从主树链入；详见 core/verify_contract.py 模块文档）
  static_scope: "main"
  # verify worktree node_modules 供给模式（verify.yaml deps_mode > 本配置 > 代码默认）：
  #   hardlink（默认，推荐）— 主树 node_modules 以 os.link 硬链接副本共享 inode，
  #     秒级供给、不占双倍磁盘（每 serving worktree 仅 ~24M）。约束：避免主树与
  #     worktree 并发构建（in-place 写入会穿透共享 inode）。
  #   prefer-offline — worktree 内 npm ci --prefer-offline 实装一份独立
  #     node_modules（~1.6G/份，真拷贝），失败回退 npm install --prefer-offline。
  #   主树无 node_modules 时 hardlink 自动降级 prefer-offline（MUST NOT 失败）。
  deps_mode: "hardlink"
  # 实现阶段末尾的代码质量审查开关（调用 ocr，alibaba open-code-review）：
  # 开启后框架在 merge-back 成功、tester 派发时点启动 impl-ocr 异步车道审查
  # 本次改动，与测试验证并行执行，join 于 testing 出口裁决（add-impl-ocr-
  # parallel-lane）；需要环境已安装 ocr，未安装时自动按 unavailable 降级跳过。
  impl_code_review: false
  # 收尾审查 join 裁决模式（add-impl-ocr-parallel-lane D3）：
  #   gate（缺省，保守）— join 时存在非 rejected findings → 经 bug_found 打回
  #     实现者修复轮（上限 1 次，仍出的 findings 转台账后放行）；
  #   advisory — findings 一律写入 code-review 台账（喂 code-fix 自动修复车道），
  #     join 永不打回。
  impl_code_review_mode: gate
  # 收尾审查 ocr LLM 单请求超时（秒，add-impl-code-review-tuning）：
  # 正整数，缺省 600。不配置时 ocr 走其内置 300s 默认——实测 8 路并发 +
  # 300s 单请求超时会撞穿首字节等待导致大面积文件级 timeout。写入 run 级
  # ocr 配置 custom_providers.fenix-impl.timeout_sec，确定性生效。
  impl_code_review_timeout_sec: 600
  # impl-ocr 车道级硬超时（秒，add-impl-ocr-parallel-lane）：框架侧 run_impl_ocr
  # 从启动到出产物的整体墙钟上限，缺省 2400。注意与上方
  # impl_code_review_timeout_sec（LLM 单请求超时，缺省 600）是两种粒度、
  # 按键分离。超时降级 unavailable，不阻塞 spec 推进。
  impl_code_review_lane_timeout_sec: 2400
  # 收尾审查 ocr 并发子任务上限（--concurrency，add-impl-code-review-tuning；
  # 缺省 4 由 add-impl-ocr-parallel-lane D7 从 2 上调——实测 2 对大 diff 明显
  # 喂不饱，570s 连第一组都没跑完。ocr 内置缺省 8。模板示例值即显式配置、
  # 会压过读取器缺省）。实测 8 路并发同时打同一 provider 网关会放大首字节
  # 延迟；4 以吞吐换稳定。
  impl_code_review_concurrency: 4
  # 全仓审查并发（add-code-review-concurrency-and-429-resilience）：控制
  # 全仓审查 run（manual_full / manual_window / scheduled）的并行审查度，
  # 一个键同时注入两处——提示词侧子代理并行扇出上限（波内并行、波次滚动
  # 推进）与 ocr scan --concurrency（ocr 内置缺省 8，2026-09-24 429 事故的
  # 并发来源之一）。正整数，缺省 4；模板示例值必须等于缺省值（否则模板
  # 派生配置恒为显式旧值，缺省调整失效）。SPEC/implement 任务内审查由
  # 上方 impl_code_review_concurrency 控制，语义不变。
  repo_code_review_concurrency: 4
  # 收尾审查 ocr 审查力度（--effort，add-impl-code-review-tuning）：
  # 合法值 low | medium | high，缺省 low（ocr 内置缺省 medium）。low 更快更省
  # 但 recall 偏低（ocr precision 优先的刻意取舍），可随时上调。经提示词命令
  # 示例承载——实现者须照抄命令串才生效（软约束）。
  impl_code_review_effort: low
  # fix-agent-lane-efficiency D3：run 级上下文经济性诊断告警阈值
  # （context_cost_per_turn）。单 run 的平均每轮 input tokens（assistant 事件
  # 数除累计 `message.usage.input_tokens`）超过该值时，run 末打诊断 WARNING
  # （含 run_id 与实测值），提示该 run 上下文成本接近 O(轮数²) 结构。缺省
  # 200000（即 per-turn 均值 20 万 token）；0 = 关闭告警。告警不阻断 run、
  # 不触发独立人工告警（告警降噪铁律）；turns < 5 的零轮/短跑只落指标不打
  # 告警（最小样本门槛，空跑噪声抑制）。
  context_cost_per_turn_threshold: 200000
  # verify-serving 目录生命周期回收（fix-verify-serving-disk-reclaim）：
  # daemon 启动 reconcile + 600s 周期清扫，对无主 worktree（spec 不在
  # changes/archive、未登记、无活进程、超宽限期）执行 git worktree remove --force
  # + prune，并按同判据回收 <spec>-boot.log。
  serving_reclaim:
    enabled: true

# ---- Push Ref Hygiene (fix-push-ref-lifecycle) ----
# done→pushed 的推送生命周期治理：
#   - main 优先推送（git push origin main）为成功判据，feature 分支尽力推送（留痕）
#   - 推送失败按指数退避延迟重试，退避期内 recovery 重放跳过
#   - 连续失败达 max_retries 后停止自动重试，发 push_failed 困境信号升级人工
pm:
  # 派发锁冲突退避（improve-run-lifecycle-governance D5）：派发 implementer 遇
  # 「worktree already active」时按此序列（秒）递增退避，期间不消耗 attempt 重试
  # 配额、不写 retries exhausted；spec 保持 ready 且 error 字段记录
  # 「backoff until <time>」。序列耗尽仍持锁 → dispatch_stalled 信号升级处置。
  dispatch_backoff_schedule: [30, 120, 600]
  push:
    # 指数退避秒数（默认 [300, 900]：首次失败后 5 分钟、再次失败后 15 分钟重试）
    retry_backoff_seconds: [300, 900]
    # 连续推送失败上限（默认 3）：达上限后停止自动重试并升级人工
    max_retries: 3

# ---- Knowledge Atlas（项目知识真相源，add-knowledge-atlas）----
# SPEC 归档后自动派发蒸馏 run，把当前业务规则蒸馏进 spec/knowledge/ 真相源
# （index.md 总目录 + domains/<域>/<能力>.md 能力页 + adr/ 决策索引）。
knowledge:
  # 总开关：false 时归档不派发蒸馏（归档照旧），项目知识页签显示禁用占位。
  # 修改后约 30s 配置热更新生效，无需重启 daemon。
  enabled: true
  # ---- 维护车道（add-knowledge-atlas-maintenance）----
  # 真相源（spec/knowledge/）周期维护车道开关；缺省全开。
  # 每日 audit 体检（五类病灶扫描 + 机械自修/语义转写分级处置 + 体检报告
  # .fenix/knowledge_audit_report.md）。false = 静默跳过，无日志噪音。
  audit_enabled: true
  # ---- audit 疑点台账（add-knowledge-audit-finding-ledger）----
  # no-conflict 判定按内容豁免：两页全文 sha256 均未变时次日初筛跳过派发
  # 复核（台账 .fenix/knowledge_audit_findings.json）；任一页内容变更自动
  # 解冻回 suspected 重新派发。false = 每次初筛都照常派发复核。
  no_conflict_exempt: true
  # 同一疑点连续 N 轮复核均无确定性判定（仍 suspected，如转写失败回滚）即
  # 升级待人工：登记 .fenix/todo.md 并停止自动复核，人工消费后删除台账对应
  # 条目即恢复。豁免解冻重派不计入升级轮次（每次内容变更重置）。
  escalate_after_rounds: 2

# ---- Dashboard (optional) ----
# Web Dashboard 默认端口（可选）。优先级: --port > ~/.config/fenixd/dashboard.yaml 的 port > 本字段 > 8787
dashboard:
  port: 8787

# ---- Administrator 自愈（可选）----
# Fenixd 无人值守自愈：轻量监视器零成本检测困境信号，困境才唤起 Administrator Agent 处置，
# 处置不了再升级人工（Dashboard 告警横幅）。admin.enabled: false 即整体停用。
admin:
  # 是否启用 Administrator 自愈
  enabled: true
  # 监视线程周期（分钟）
  interval_minutes: 5
  # Administrator Agent 使用的模型名（官方 Claude 模型名；未配置时复用框架默认 cc-switch 网关模型）
  agent_model: "claude-sonnet-5"
  # ---- 转人工裁决告警四段式调查叙事（upgrade-narrative-to-investigation）----
  # 告警以机械文案立即落盘后，后台经轻量 LLM 调用生成「发生了什么/调查结论/
  # 为什么需要你决策/决策选项」四段式调查叙事（验证族信号自动采集验证报告/
  # 判定轮次/失败演进等材料作根因依据），原子补写侧车
  # .fenix/admin_alerts_narrative/<alert_id>.json，Dashboard 读侧按 alert_id
  # 合并渲染（admin_alerts.json 记录本体不可变）。覆盖全部转人工裁决告警
  # 发射点（含 token_budget 与 merge-back 产物路径缺失两个旁路点）。
  # 叙事开关（缺省 true）：关闭后写告警零 LLM 调用、零额外延迟，行为与本功能
  # 落地前完全一致（熔断器同时旁路）。生成失败（异常/超时/结构校验不过，
  # 至多 2 次尝试）或连续失败熔断期跳过时写终态侧车（机械说明、model=null），
  # 告警本体与裁决链路不受影响。
  narrative_enabled: true
  # 叙事单次调用硬超时（秒，缺省 180）：补叙已异步化，超时不再阻塞告警落盘；
  # 上调至 180 覆盖网关 stall 长尾（实测 p90≈55s、max≈188s）。非法值回退缺省。
  narrative_timeout_seconds: 180
  # 叙事使用的模型名（缺省空=回退链 admin.agent_model，仍为空时复用框架默认
  # cc-switch 网关模型）。
  narrative_model: ""
  # 告警自愈安静窗口（分钟，add-alert-self-heal-marking，缺省 1440）：基础设施
  # 瞬态族告警（daemon_errors 指纹风暴 / run_infra_failure 熔断 / evo 分析失败 /
  # 处置收敛升级）签名安静多久后自动标「已自愈」转已处理。1440 盖过跨日同刻
  # 复发节律（最后一次复发后一整个复发周期无复现才收口）。非法值回退缺省。
  self_heal_quiet_minutes: 1440
  # 同 spec 同类困境信号的唤起冷却（分钟），避免反复唤起烧钱
  escalation_cooldown_minutes: 60
  # 合回 WIP overlap 无主宽限（分钟，add-mergeback-wip-active-coordination 2.3）：
  # code-fix 延迟批合回被主树未提交改动挡住、占用者识别为「无主陈旧 WIP」
  # （在飞实现车道分支改动集零命中）时，继续事件驱动等待该时长（期间可能
  # 变为有主）；宽限耗尽仍无人认领则升级 mergeback_wip_orphan_stuck major
  # 人工告警（MUST NOT 无限期静默等待，也绝不自动 stash/丢弃主树改动）。
  # 在飞持有者场景不受本宽限约束（由持有者 run 终态事件驱动重试），缺省 30
  # 对齐 escalation_cooldown_minutes 量级。
  mergeback_wip_orphan_grace_minutes: 30
  # 状态无驱动（implementing/testing 无活动 run/无存活子进程/无待派发）探测阈值
  # （分钟）：远短于 stuck（run_timeout+600s，当前约 160 分钟），使「状态无驱动」
  # 分钟级可发现、早于 stuck 触发；与 stuck 阈值互不影响。
  orphaned_state_threshold_minutes: 15
  # 注：admin.stuck_threshold_minutes 已弃用。stuck 阈值现由 agents.run_timeout_seconds
  # 单源派生（run_timeout + 600s 宽限），此处不再保留该配置行。
  # merge 熔断阈值（复用 agents.merge_breaker_threshold 默认 2）
  # merge_breaker_threshold: 2
  # 规划性重启（supervisor 检测到 .fenix/restart_request）时的排水窗口（秒）：
  # daemon 收到 SIGTERM 后等待在跑 run 自然终态，到期才走 terminate 收口；
  # 0 = 不排水、快速停机（在飞任务标记 interrupted，重启后继续做）。
  # supervisor 的 SIGKILL 等待 = 本值 + 120s 余量。新项目缺省 0：避免 1-2 小时级
  # implementer/planner 在飞场景每次重启必等满排水窗口；有特殊需求可手改大值。
  shutdown_drain_seconds: 0

  # ---- 周期性代码审查（add-code-review-agent-and-quality-tab，可选）----
  # 设置页「质量」页签提供该开关（读/写 GET/POST /api/config 的
  # admin.code_review.enabled；2026-09-19 从项目页「质量」分面迁来——分面只保留
  # 结果展示与手动触发）。开启后于每日触发时点（admin.code_review.run_at，
  # 缺省同 admin.self_review.run_at）派发 code-review agent，审查窗口内开发
  # SPEC 的产品代码质量，问题沉淀到
  # .fenix/code-review/items.jsonl 台账供「质量」分面展示与消费。
  # code_review:
  #   # 是否启用周期性代码审查（缺省 false；手动触发不受此开关约束）
  #   enabled: false
  #   # 全仓审查 manifest 上限（正整数，缺省 500）：超过上限截断，避免大仓
  #   # 全量审查耗时过长/烧钱。窗口审查按窗口收集，也受此上限约束。
  #   max_files: 500
  #   # 审查范围（add-code-review-scope-config）：window（缺省）= 当期审查
  #   #   （只审窗口内变更文件，窗口起点优先审查自身水位，缺省回退自省）；
  #   #   full = 全库审查（与项目页「全库审查」手动按钮同语义）。
  #   #   非法值（含缺失/非字符串）一律回退 window，巡检不因脏配置中断；
  #   #   full 档同样受上方 max_files 上限约束（超限截断）。
  #   scope: window
  #   # 事中零进度停滞告警阈值（分钟，正整数，缺省 15；add-code-review-sharded-out）：
  #   # run 处于 running 且主产物与分片聚合 done==0 持续超过本阈值时，经 AdminStore
  #   # 落一条人工告警（含 run_id / 已运行分钟 / 聚合 done=0 事实与「疑似子代理等待
  #   # 收工模式」归因提示；单 run 至多一条，去重键 code-review-stall-<run_id>）。
  #   # 缺失/非法/非正整数一律回退 15。
  #   stall_alert_minutes: 15
  #   # 触发时点（add-code-review-run-at，本地时间 HH:MM）：与每日自省时点解耦，
  #   # 错峰派发避免周期审查与自省（连带分析链）同刻齐发触发 LLM 网关限流；
  #   # 缺省回退 admin.self_review.run_at（未配置时行为与历史逐位一致），
  #   # 非法值（格式/越界时分/非字符串）同样回退，巡检不因脏配置中断。
  #   # run_at: "03:30"

  # ---- 审查 run stall 看门狗（decouple-codefix-review-lanes 3.1）----
  # 周期审查 run 无产出超阈值（分钟，正整数，缺省 30）时自动取消该 run 并走
  # 既有急救落账路径（已完整落盘的产物抢救入账、告警留痕），释放其占用的车道
  # 与锁。双判据同时无进展才计时：进度产物 mtime 与 run 子进程进程树 CPU 时间
  # ——任一判据有进展即重置（单 mtime 判据会被「网络僵死但进程活着空转」欺骗，
  # 09-24 事故 2h20m 仅 49s CPU 实证）。挂在 admin monitor 巡检节拍上，无新增
  # 线程/定时器。缺失/非法/非正整数一律回退 30，巡检不因脏配置中断。
  # review_stall_minutes: 30

  # ---- 自动修复代码问题（add-code-review-auto-fix，可选）----
  # 设置页「质量」页签「周期性代码审查」下方提供该开关（读/写 GET/POST
  # /api/config 的 admin.code_review_fix.*）。开启后把审查台账 open 条目按批
  # 派 code-fix agent 在独立 worktree 内修复，每批必过全量回归（verify.yaml
  # regression 段）才合回主树并把条目置 resolved；两路激活（审查收尾 +
  # 30 分钟 full scan 兜底）。无有效 regression 段时 fail-closed 不合回，
  # 并经既有 AI 起草通道补段。关闭（缺省）= 全链路零动作。
  # code_review_fix:
  #   # 是否启用自动修复车道（严格 bool，缺省 false）
  #   enabled: false
  #   # 每批修复的台账条目数（正整数，缺省 20）：批次粒度即节流阀，
  #   # 每批之间有一次全量回归。
  #   batch_size: 20
  #   # 回归失败后定向重试轮上限（整数，缺省 3，合理区间 1-5，add-
  #   # codefix-targeted-retry）：重试轮只修失败用例相关问题（含修测试
  #   # 本身）并只重跑失败用例子集；每轮烧一次 agent run，设过大烧钱、
  #   # 0 会让「重试一次」的现状语义都保不住——越界/非法回退缺省 3。
  #   targeted_retry_max: 3
  #   # 批收尾回归两段式（严格 bool，缺省 true，add-codefix-affinity-
  #   # batching）：true=链内非末批按批触碰面定向回归（verify.yaml
  #   # regression.cmd 以 #{test_targets} 注释位声明参与定向化，框架按
  #   # 批内改动映射测试路径注入，同值导出 FENIX_TEST_TARGETS 环境变量；
  #   # cmd 无占位符或映射空集时自动回退全量）+ 链末批恒走全量回归兜底；
  #   # false=全批全量回归（等价既有行为）。非法值（非 bool）回退缺省
  #   # true 并记 warning。
  #   #
  #   # 安全 cmd 写法样例（verify.yaml regression 段，整体加引号）：
  #   #   cmd: "python3 -m pytest ${FENIX_TEST_TARGETS:-tests/} -q
  #   #         --junit-xml=.fenix/regression/junit.xml #{test_targets}"
  #   # - 尾部 #{test_targets} 供框架检测占位符声明（不加引号会被 YAML
  #   #   当行内注释剥掉，永远不参与定向化）；执行层该 token 位于词首=
  #   #   shell 行内注释，pytest 不可见，仅作声明锚点（定向替换发生在
  #   #   注释内，无害）。
  #   # - 测试集由 ${FENIX_TEST_TARGETS:-tests/} 注入：定向窗口框架导出
  #   #   该环境变量展开为触碰面测试路径；回退窗口（末批恒全量/映射空
  #   #   集/配置关）变量不在场，POSIX 缺省展开回落 tests/ = 全量。
  #   # MUST NOT 把 {test_targets} 直接写进参数位（如
  #   # `pytest {test_targets} -q`）：周期回归窗口（admin.regression，
  #   # 定义上即全量、不导出该变量）字面占位符会传给 pytest 致回归必挂；
  #   # 批收尾回退窗口虽有消毒兜底（add-codefix-test-targets-fallback-
  #   # sanitization 替换为 tests/），MUST NOT 依赖消毒——参数位写法
  #   # 本身即配置错误。
  #   targeted_regression: true
  #   # 每日夜间静默窗（可选，多窗，evo-night-window-guard-coverage-closure）：
  #   # code-fix 批守卫、周期审查顺延、admin 唤起避让与自进化避让共用的断窗
  #   # 避让窗（同一解析器，不设第二份窗配置）。多窗以逗号/分号分隔，每段
  #   # HH:MM-HH:MM（本地时刻，start<end，单日不跨午夜），缺省
  #   # "03:00-03:15,04:15-04:45"（缺省即覆盖已观测散布断窗形态，命中任一窗
  #   # 即避让）；设为空串或 off 完全禁用（行为与无守卫一致）。沿「不在模板
  #   # 强配」策略：此处仅文档示例，缺省不启用，需覆盖缺省时取消注释。
  #   # night_quiet_window: "03:00-03:15,04:15-04:45"

  # ---- 周期性全量回归（add-test-regression-tab，可选）----
  # 设置页「质量」页签提供该开关（读/写 GET/POST /api/config 的
  # admin.regression.enabled）。开启后与每日自省同周期（admin.self_review.run_at
  # 时点）自动执行一次全量回归，结果落到 .fenix/regression/last-run.json 供项目页
  # 「测试回归」分面展示。**前置条件**：项目 .fenix/verify.yaml 须有有效 regression
  # 段（cmd/output/timeout/long_test_threshold_seconds 声明，见 verify 契约模板）——
  # 无段时周期检查点跳过（reason: not_configured），不会派发空跑。与 implementer
  # 收尾的全量套件互斥（主机级 .fenix/full-suite.lock，同一主机同一时刻只跑一套
  # 完整测试）。手动触发（项目页「立即执行全量回归」）不受此开关约束。
  # regression:
  #   # 是否启用周期性全量回归（缺省 false；手动触发不受此开关约束）
  #   enabled: false

# ---- Agent Run 超时护栏（可选）----
# timeout_supervision 监控单次 Agent 运行的墙钟上限，防止超时参数再次与 run 超时脱钩。
# 护栏联动（supervision-timeout-config-consistency）：absolute_max_seconds MUST ≥
# max(生效超时) + (max_extensions + 2) × extension_seconds（配置校验层全部署最大
# 可达下限，见 core/config.py supervision_config_floor；+2 覆盖 fast-track higher
# 档续期预算加成）。低于下限时默认自动对齐抬升并持久化，auto_align 显式关闭时
# 启动/热更新 fail-fast（不再仅告警后按兜底值继续）。
timeout_supervision:
  # 是否启用 supervision（false 时整段不参与校验，也不对运行施加额外墙钟上限）
  enabled: false
  # 单次运行墙钟硬上限（秒）。默认值 16200 = run_timeout(9000) + 4×1800 对齐
  #（最大可达续期预算口径，与 core/config.py SUPERVISION_DEFAULTS 7200 同源派生），
  # 与超时参数单源联动，杜绝「absolute_max 远小于跑满的运行」类脱钩事故。
  absolute_max_seconds: 16200

# ---- PM（派发与治理，可选）----
# 全部缺省均向后兼容：不配置时进入默认行为（老化关闭、族谱上限 3/2）。
pm:
  # 派发队列老化（design D3）：低优 SPEC 等待超过 initial_wait 后逐档降优先级，
  # 避免被高优 SPEC 长期饿死。内存态实现，daemon 重启重建队列即从零计时。
  dispatch:
    aging:
      # 是否启用老化（缺省 false：effective == base，行为与未启用完全一致）
      enabled: false
      # 等待多久（分钟）后开始老化
      initial_wait_minutes: 30
      # 每等待这么多分钟降一档（优先级数值 -1）
      step_down_minutes: 15
      # 最多降档数（封顶；P6 最多降到 P2，避免挤占高优窗口）
      floor_levels: 4
  # fix 族谱收敛（design D4）：fix- 前缀递归派生（fix-x → fix-fix-x → ...）的
  # 深度/宽度上限。越界时中止自动创建并产生 family_explosion 信号转人工处置。
  family:
    # 连续 fix- 前缀层数上限（缺省 3）
    # max_depth: 3
    # 同根未完成 fix 子代数量上限（缺省 2）
    # max_width: 2

# ---- Arbiter（add-arbiter-lane：全局决策者车道）----
arbiter:
  # 总开关。false = 关闭态零侵扰：冻结/升级边走既有 narrative+人工路径，
  # 全部行为与本 SPEC 合入前逐字节一致（不派发、不落台账、不改告警形态）。
  enabled: true
  # 单次调查 run 墙钟预算（秒）：runner 侧对 arbiter run 超时取 min 封顶；
  # 超限 → run 终止 → 半成品调查包升级人工（不静默死亡）。
  budget_wallclock_s: 1800
  # 单次调查 run token 预算：usage 四键累计事后记账；超限 → 停止自主尝试、
  # 半成品调查包升级人工。
  budget_tokens: 1000000
  # 同触发连败死人开关阈值：同 spec 同失败签名连续失败达本次数后停止自主
  # 尝试，半成品调查包升级人工（缺省 2——第一次失败留重试余量）。
  max_consecutive_failures: 2

# ---- Project-Specific Commands ----
commands:
  # Test command (how to run the test suite)
  test: "echo 'No tests configured yet'"
  # Build command
  build: "echo 'No build configured yet'"
  # Start command (for verifier to launch the project)
  start: "echo 'No start command configured yet'"

# ---- Logging ----
logging:
  # Log directory
  dir: ".fenix/logs"
  # Log level: DEBUG | INFO | WARNING | ERROR
  level: "INFO"
  # Maximum log file size before rotation (MB)
  max_size_mb: 10
  # Number of rotated log files to keep
  backup_count: 5
  # Days to retain logs
  retain_days: 30
