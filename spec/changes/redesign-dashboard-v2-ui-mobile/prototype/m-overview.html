<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>移动端 · 跨项目概览 — Bento v2</title>
<!-- 移动端原型（390px 基准）：Bento 定稿语言 + <768 惯例（表格转卡片/2×2 磁贴/触控目标） -->
<style>
  html, body { margin: 0; padding: 0; background: #f8fafc; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1e293b; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bento { background: #fff; border: 1px solid #eef2f7; border-radius: 16px; box-shadow: 0 1px 3px rgba(15,23,42,0.05); }
  /* 桌面浏览器预览约束：锁定 390px 手机屏宽（真机/DevTools 下随视口自适应） */
  #root { max-width: 390px; margin: 0 auto; min-height: 100vh; background: #f8fafc; box-shadow: 0 0 0 1px #eef2f7; }
</style>
<script src="vendor.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';
  var h = React.createElement;
  var A = window.antd;
  var CP = A.ConfigProvider, Tag = A.Tag, Button = A.Button, Progress = A.Progress, Select = A.Select, Input = A.Input;
  var C = { text: '#1e293b', text2: '#475569', text3: '#64748b', text4: '#94a3b8', blue: '#2563eb', blueSoft: '#eff6ff',
    green: '#16a34a', greenSoft: '#f0fdf4', red: '#dc2626', redSoft: '#fef2f2', amber: '#d97706', amberSoft: '#fffbeb', cyan: '#0891b2', cyanSoft: '#ecfeff' };
  var TONE = { info: [C.blue, C.blueSoft], warning: [C.amber, C.amberSoft], critical: [C.red, C.redSoft], good: [C.green, C.greenSoft], muted: [C.text3, '#f1f5f9'] };
  function Pill(k, children) { var p = TONE[k] || TONE.muted; return h(Tag, { style: { marginInlineEnd: 0, borderRadius: 999, fontSize: 12, paddingInline: 9, color: p[0], background: p[1], borderColor: 'transparent', fontWeight: 500 } }, children); }
  function IconDots() { return h('svg', { width: 16, height: 16, viewBox: '0 0 14 14', fill: 'currentColor' }, h('circle', { cx: 2.6, cy: 7, r: 1.3 }), h('circle', { cx: 7, cy: 7, r: 1.3 }), h('circle', { cx: 11.4, cy: 7, r: 1.3 })); }

  function Kpi(anchor, label, node) {
    return h('div', { 'data-proto-id': anchor, className: 'bento', style: { padding: '14px 16px' } },
      h('div', { style: { fontSize: 12, fontWeight: 500, color: C.text3 } }, label), node);
  }
  function Donut(pct) {
    var r = 20, circ = 2 * Math.PI * r;
    return h('svg', { width: 56, height: 56, viewBox: '0 0 56 56' },
      h('circle', { cx: 28, cy: 28, r: r, fill: 'none', stroke: '#eef2f7', strokeWidth: 6 }),
      h('circle', { cx: 28, cy: 28, r: r, fill: 'none', stroke: C.blue, strokeWidth: 6, strokeLinecap: 'round', strokeDasharray: (pct / 100 * circ).toFixed(1) + ' ' + circ, transform: 'rotate(-90 28 28)' }),
      h('text', { x: 28, y: 32, textAnchor: 'middle', fontSize: 13, fontWeight: 700, fill: C.text }, pct + '%'));
  }
  function ProjectCard(p, err) {
    return h('div', { 'data-proto-id': 'overview-project-card-' + p.name, className: 'bento', style: { padding: '14px 16px' } },
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' } },
        h('span', { style: { fontSize: 15, fontWeight: 700 } }, p.name),
        err ? Pill('critical', '项目错误') : Pill('good', '运行中'),
        h('span', { style: { flex: 1 } }),
        h(Button, { type: 'text', size: 'small', icon: IconDots(), 'aria-label': '更多操作' })),
      h('div', { className: 'num ellipsis', style: { fontSize: 12, color: C.text4, marginTop: 4 } }, p.path),
      err
        ? h('div', { style: { fontSize: 12, color: C.red, marginTop: 6 } }, p.error)
        : h('div', null,
            h('div', { className: 'ellipsis', style: { fontSize: 12, color: C.text3, marginTop: 6 } }, p.desc),
            h('div', { style: { display: 'flex', gap: 14, marginTop: 8 } },
              h('span', { className: 'num', style: { fontSize: 12, color: C.text3 } }, 'SPEC ', h('span', { style: { fontWeight: 700, color: C.text } }, p.count)),
              h('span', { className: 'num', style: { fontSize: 12, color: C.text3 } }, '问题 ', h('span', { style: { fontWeight: 700, color: p.problems > 0 ? C.red : C.text } }, p.problems)),
              h('span', { className: 'num', style: { fontSize: 12, color: C.text3 } }, '活跃 ', h('span', { style: { fontWeight: 700, color: p.runs > 0 ? C.amber : C.text } }, p.runs))),
            h(Progress, { percent: p.pct, size: 'small', strokeColor: C.blue, railColor: '#eef2f7', showInfo: false, style: { marginTop: 8 } }),
            h('div', { className: 'num', style: { fontSize: 12, color: C.text3, marginTop: 4 } }, p.done + '/' + p.total + ' · ' + p.pct + '%')));
  }

  function Page() {
    var vals = [1.8, 2.4, 2.1, 3.2, 2.8, 4.1, 3.6, 5.0, 4.4, 3.9, 4.8, 5.6, 5.1, 6.2, 5.8, 6.9, 6.4, 7.4, 7.0, 8.2];
    var W = 280, H = 40, max = 8.2;
    var pts = vals.map(function (v, i) { return [4 + (i * (W - 8)) / 19, H - 5 - (v / max) * (H - 10)]; });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    return h('div', { style: { minHeight: '100vh' } },
      h('main', { style: { padding: '16px 14px 32px' } },
        h('div', { 'data-proto-id': 'overview-titlebar' },
          h('div', { style: { fontSize: 20, fontWeight: 700, letterSpacing: -0.3 } }, '跨项目概览'),
          h('div', { className: 'num', style: { fontSize: 12, color: C.text3, marginTop: 2 } }, '监控 5 个项目')),
        // 告警
        h('div', { 'data-proto-id': 'overview-alert-banner', className: 'bento', style: { marginTop: 14, padding: '12px 12px 6px', borderLeft: '3px solid ' + C.red } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
            Pill('critical', '严重 1'),
            h('span', { style: { fontSize: 13, fontWeight: 600, flex: 1 } }, h('span', { className: 'num' }, '2'), ' 条待处理'),
            h('a', { style: { fontSize: 12, color: C.text4 }, tabIndex: 0 }, '展开')),
          h('div', { style: { marginTop: 8, borderTop: '1px solid #f1f5f9', padding: '9px 2px' } },
            h('div', { className: 'ellipsis', style: { fontSize: 13, fontWeight: 600 } }, '处置链中断：choice 载荷通道缺失'),
            h('div', { className: 'num', style: { fontSize: 12, color: C.text4, marginTop: 3 } }, 'atlas-api · 09:14'),
            h('div', { style: { display: 'flex', gap: 8, marginTop: 8 } },
              h(Button, { size: 'small', type: 'primary', style: { flex: 1 } }, '去处置'),
              h(Button, { size: 'small', style: { flex: 1 } }, '标记已处理')))),
        // KPI 2×2
        h('div', { 'data-proto-id': 'overview-kpi-row', style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginTop: 12 } },
          Kpi('overview-kpi-card-spec', 'SPEC 总数', h('div', null,
            h('div', { className: 'num', style: { fontSize: 28, fontWeight: 700, marginTop: 6 } }, '47'),
            h('div', { className: 'num', style: { fontSize: 12, color: C.text3, marginTop: 4 } }, '今日 6 · 7 天 18'))),
          Kpi('overview-kpi-card-progress', '任务进度', h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, marginTop: 6 } },
            Donut(62),
            h('div', null, h('div', { className: 'num', style: { fontSize: 15, fontWeight: 700 } }, '214 / 345'), h('div', { className: 'num', style: { fontSize: 12, color: C.text3, marginTop: 2 } }, '已完成')))),
          Kpi('overview-kpi-card-token', 'Token 消耗', h('div', null,
            h('div', { className: 'num', style: { fontSize: 24, fontWeight: 700, marginTop: 6 } }, '9380万'),
            h('svg', { width: '100%', height: H, viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', style: { marginTop: 4 } },
              h('path', { d: line, fill: 'none', stroke: C.blue, strokeWidth: 1.5 }),
              h('circle', { cx: pts[19][0], cy: pts[19][1], r: 2.5, fill: C.blue })),
            h('div', { className: 'num', style: { fontSize: 12, color: C.text3, marginTop: 4 } }, '平均每 SPEC 198万'))),
          Kpi('overview-kpi-card-agent', '活跃 Agent', h('div', null,
            h('div', { className: 'num', style: { fontSize: 28, fontWeight: 700, marginTop: 6 } }, '8'),
            h('div', { style: { display: 'flex', height: 12, borderRadius: 6, overflow: 'hidden', gap: 2, marginTop: 8 } },
              [3, 1, 1, 2, 1].map(function (v, i) { return h('div', { key: i, style: { flex: v, background: ['#2563eb', '#f59e0b', '#0891b2', '#db2777', '#92710c'][i] } }); })),
            h('div', { className: 'num', style: { fontSize: 12, color: C.text3, marginTop: 6 } }, '实现 3 · 修复 2 · 规划/评审/运维 各 1')))),
        // 项目卡片
        h('div', { 'data-proto-id': 'overview-project-panel', style: { marginTop: 16 } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
            h('span', { style: { fontSize: 16, fontWeight: 700 } }, '项目清单'),
            h('span', { className: 'num', style: { fontSize: 12, color: C.text4 } }, '5 个 · 运行中 2')),
          h(Input.Search, { placeholder: '搜索项目', size: 'small', allowClear: true, style: { marginTop: 10 } }),
          h('div', { style: { marginTop: 10 } },
            ProjectCard({ name: 'atlas-api', path: '/srv/projects/atlas-api', desc: '面向多团队共享的 LLM 网关聚合与路由服务：统一注册多家 provider…（示例长注释）', count: 18, problems: 1, runs: 3, done: 14, total: 18, pct: 78 }),
            h('div', { style: { height: 12 } }),
            ProjectCard({ name: 'edge-gateway', path: '/srv/edge-gateway', error: '.fenix/STATE.md 解析失败：schema 版本不兼容' })),
          h(Button, { size: 'small', block: true, style: { marginTop: 12 } }, '查看全部 5 个项目'))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(CP, { theme: {
    token: { colorPrimary: '#0f1115', colorPrimaryHover: '#43454a', colorPrimaryActive: '#2c2c2e', colorLink: C.blue, colorInfo: C.blue,
      colorSuccess: C.green, colorError: C.red, colorWarning: C.amber, colorText: C.text, colorTextSecondary: C.text2, colorTextTertiary: C.text3, colorTextQuaternary: C.text4,
      colorBgLayout: '#f8fafc', colorBorder: '#e2e8f0', colorBorderSecondary: '#eef2f7', colorSplit: '#f1f5f9',
      borderRadius: 12, borderRadiusSM: 8, borderRadiusLG: 16, controlHeight: 32, controlHeightSM: 28,
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif" },
    components: { Button: { primaryShadow: 'none', defaultShadow: 'none' } } } }, Page()));
})();
</script>
<script src="annotator.js" defer></script>
</body>
</html>
