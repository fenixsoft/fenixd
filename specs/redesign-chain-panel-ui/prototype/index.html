<title>原型 · 重绘处置链页签（redesign-chain-panel-ui）</title>

<style>
:root{
  --text:#0f1115; --text2:#61666b; --text3:#81858c; --text4:#adb2b8;
  --border:rgba(0,0,0,.16); --border2:rgba(0,0,0,.10); --split:rgba(0,0,0,.08);
  --bg-soft:#f9fafb; --link:#4176e6; --ok:#22c55e; --err:#ec1313; --warn:#f59e0b;
  --hair:#f1f5f9; --bento-bd:#eef2f7; --hover:#f8fafc;
  --font:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#eef1f5;font-family:var(--font);color:var(--text);font-size:13px}
.proto-shell{max-width:1560px;margin:0 auto;padding:12px 16px 40px}
.bento{background:#fff;border:1px solid var(--bento-bd);border-radius:12px;
  box-shadow:0 1px 3px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.03)}
.num{font-size:28px;font-weight:600;line-height:34px;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;color:var(--text3)}
.sub{font-size:12px;color:var(--text3);margin-top:2px;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.t2{color:var(--text2)} .t3{color:var(--text3)} .t4{color:var(--text4)}
.spacer{flex:1 1 auto;min-width:0}
/* 卡片 */
.card-hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.card-title{font-size:14px;font-weight:600}
.card-extra{font-size:12px;color:var(--text3)}
.card-bd{padding:4px 16px 10px}
/* 统计行 */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.stat-tile{padding:14px 16px}
/* 行 */
.hairline{border-bottom:1px solid var(--hair)}
.rowitem{padding:12px 0}
.rowitem:last-child{border-bottom:none}
.rowlink{cursor:pointer}
.rowlink:hover{background:var(--hover)}
/* ── 人工队列内嵌裁决控件 round3：内嵌面板式重设计（左控件右动作列，
   对齐 overview AlertBanner 的 AlertActionColumn 竖排语义） ── */
.adjud-panel{margin:8px 14px 12px 32px;background:var(--bg-soft);border:1px solid var(--hair);border-radius:8px;padding:10px 12px;display:flex;gap:12px;align-items:stretch}
.adjud-hd{flex:0 0 64px;font-size:12px;font-weight:600;color:var(--text2);padding-top:4px}
.adjud-main{flex:1;min-width:0}
.adjud-side{display:flex;flex-direction:column;gap:6px;min-width:88px}
.adjud-side .ant-btn{width:100%;margin:0}
.siglink{cursor:pointer}
.siglink:hover{color:var(--link);text-decoration:underline}
.esc-row{padding:10px 14px;border-bottom:1px solid var(--hair)}
.esc-row:last-child{border-bottom:none}
.esc-l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.esc-l2{margin-top:5px;color:var(--text);font-size:13px;line-height:20px}
.esc-l3{margin-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 配额 */
.grouphd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg-soft);
  border-radius:8px;padding:7px 12px;margin:10px 0 2px}
.sig-row{display:grid;grid-template-columns:minmax(0,1fr) 260px minmax(0,1.2fr) 120px;
  gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--hair)}
.sig-row:last-child{border-bottom:none}
.qchip{display:inline-flex;align-items:center;gap:6px}
.qbar{width:56px;height:4px;border-radius:2px;background:var(--hair);overflow:hidden}
.qbar>i{display:block;height:100%;border-radius:2px}
/* 在办链进度 */
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.step .bar{width:72px;height:4px;border-radius:2px;background:var(--hair);overflow:hidden}
.step .bar>i{display:block;height:100%;border-radius:2px}
.steparrow{color:var(--text4);font-size:12px}
/* 抽屉 */
.sect{margin-top:14px}
.sect-hd{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:6px}
.sect-bd{font-size:13px;line-height:21px;white-space:pre-wrap;word-break:break-word}
.evidence{background:var(--bg-soft);border:1px solid var(--hair);border-radius:8px;
  padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:19px;white-space:pre-wrap;word-break:break-word;color:var(--text2)}
.choice-chip{border:1px solid var(--border);border-radius:8px;padding:6px 10px;max-width:100%}
.choice-chip.destr{border-color:var(--err)}
.choice-chip .cl{font-size:12px;font-weight:600}
.choice-chip.destr .cl{color:var(--err)}
.choice-chip .cd{font-size:11px;color:var(--text3);margin-top:2px}
.ro-note{margin-top:12px;padding:8px 12px;background:var(--bg-soft);border-radius:8px;font-size:12px;color:var(--text2)}
/* radio 黑底白字 */
.proto-radio-dark .ant-radio-button-wrapper-checked{background:#0f1115;border-color:#0f1115;color:#fff}
.proto-radio-dark .ant-radio-button-wrapper-checked::before{background:transparent!important}
/* 页脚注记 */
.proto-note{margin-top:16px;font-size:11px;color:var(--text4);text-align:center}
@media (max-width:1100px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .sig-row{grid-template-columns:minmax(0,1fr) 220px;grid-auto-rows:auto}
}
</style>

const SEV_LABEL = { critical:'critical', major:'major', warning:'warning', minor:'minor', info:'info' };

function fmtTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  const p = n => String(n).padStart(2,'0');
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function fmtDur(min){
  if(min == null) return '—';
  if(min < 60) return min + 'm';
  return Math.floor(min/60) + 'h ' + (min%60) + 'm';
}
function sevTag(sev){
  return h(Tag, {color: SEV_TAG[sev] || 'default', style:{fontSize:11, lineHeight:'18px', padding:'0 6px'}}, SEV_LABEL[sev] || sev || '—');
}
function quotaBar(used, cap, exhausted){
  const capN = cap || 0;
  const pct = capN > 0 ? Math.min(100, Math.round(used * 100 / capN)) : 0;
  const color = exhausted ? 'var(--err)' : (capN > 0 && used >= capN ? 'var(--warn)' : 'var(--text3)');
  return h('span', {className:'qbar'}, h('i', {style:{width: pct + '%', background: color}}));
}
function quotaChip(label, used, cap, exhausted, key){
  return h('span', {className:'qchip', key},
    h('span', {className:'t3', style:{fontSize:11}}, label),
    h('span', {className:'mono', style:{fontSize:12, fontVariantNumeric:'tabular-nums'}}, (used||0) + '/' + (cap||0)),
    quotaBar(used, cap, exhausted));
}

function InFlightStepper(props){
  const { it } = props;
  const cur = it.phase;
  const steps = [
    {key:'admin', label:'Admin', used:it.admin_used, cap:it.admin_cap},
    {key:'arbiter', label:'Arbiter', used:it.arbiter_rulings, cap:it.arbiter_cap},
    {key:'manual', label:'人工', used:null, cap:null},
  ];
  const kids = [];
  steps.forEach((s, i) => {
    const state = cur === s.key ? 'cur' : (steps.findIndex(x => x.key === cur) > i ? 'done' : 'future');
    const color = state === 'cur' ? 'var(--text)' : (state === 'done' ? 'var(--text3)' : 'var(--text4)');
    const barColor = s.key === 'manual' ? null
      : (state === 'cur' ? 'var(--warn)' : (state === 'done' ? 'var(--text3)' : 'transparent'));
    const inner = [];
    inner.push(h('span', {key:'l', style:{color, fontWeight: state === 'cur' ? 600 : 400}}, s.label));
    if(s.cap) inner.push(h('span', {key:'n', className:'mono t3', style:{fontVariantNumeric:'tabular-nums'}}, (s.used||0) + '/' + s.cap));
    if(barColor !== null) inner.push(h('span', {key:'b', className:'bar'}, h('i', {style:{background: barColor}})));
    kids.push(h('span', {className:'step', key:s.key}, inner));
    if(i < steps.length - 1) kids.push(h('span', {className:'steparrow', key:'a'+i}, '→'));
  });
  return h('div', {className:'stepper'}, kids);
}

/* ── 签名配额（按 spec 分组） ── */
function outcomeChips(s){
  const chips = [];
  const closed = (s.esc_total||0) - (s.esc_pending||0);
  if(s.esc_pending > 0) chips.push(h(Tag, {key:'p', color:'volcano', style:{fontSize:11, lineHeight:'18px', padding:'0 6px'}}, '待人工 ' + s.esc_pending));
  if(closed > 0) chips.push(h(Tag, {key:'c', color:'green', style:{fontSize:11, lineHeight:'18px', padding:'0 6px'}}, '已收口 ' + closed));
  if(s.exhausted) chips.push(h(Tag, {key:'e', color:'red', style:{fontSize:11, lineHeight:'18px', padding:'0 6px'}}, '配额耗尽'));
  else if(s.admin_cap && s.admin_attempts >= s.admin_cap) chips.push(h(Tag, {key:'af', color:'orange', style:{fontSize:11, lineHeight:'18px', padding:'0 6px'}}, 'Admin 顶格'));
  else if(s.arbiter_cap && s.arbiter_rulings >= s.arbiter_cap) chips.push(h(Tag, {key:'rf', color:'orange', style:{fontSize:11, lineHeight:'18px', padding:'0 6px'}}, 'Arbiter 顶格'));
  if(!chips.length) chips.push(h('span', {key:'n', className:'t4', style:{fontSize:12}}, '无上升件'));
  return chips;
}

/* ── 应用 ── */
function App(){
  const [project, setProject] = useState('all');
  const [tab, setTab] = useState('chain');
  const [escFilter, setEscFilter] = useState('all');
  const [sel, setSel] = useState(null);
  const [selRun, setSelRun] = useState(null);

  const sigIdx = useMemo(() => {
    const m = {};
    DATA.signatures.forEach(s => { m[s.signature] = s; });
    return m;
  }, []);
  // escalation.chain 对象展开：chain_signature 供联查
  const matchP = it => project === 'all' || it.project === project;
  const inflight = DATA.in_flight.filter(matchP);
  const groups = DATA.groups
    .map(g => Object.assign({}, g, {sigs: g.sigs.filter(matchP)}))
    .filter(g => g.sigs.length > 0);
  const escAll = DATA.escalations.filter(matchP);
  const queue = DATA.queue.filter(matchP);
  const escShown = escAll.filter(e => escFilter === 'all' || (escFilter === 'pending' ? !e.handled : e.handled));
  // 签名配额行点信号名 → 打开该签名最近一条上升件的处置过程（待人工优先）
  const openSig = (s) => {
    const cands = escAll.filter(e => e.chain_signature === s.signature);
    if(!cands.length) return;
    const pending = cands.filter(e => !e.handled);
    const pool = pending.length ? pending : cands;
    setSel(pool.slice().sort((a, b) => (b.created || '').localeCompare(a.created || ''))[0]);
  };

  const snapMs = new Date(DATA.snapshot).getTime();
  const within24 = escAll.filter(e => e.created && (snapMs - new Date(e.created).getTime()) <= 24 * 3600 * 1000).length;
  const sigsN = groups.reduce((n, g) => n + g.sigs.length, 0);
  const linked = groups.reduce((n, g) => n + g.sigs.filter(s => s.esc_total > 0).length, 0);
  const adminFull = groups.reduce((n, g) => n + g.sigs.filter(s => s.admin_cap && s.admin_attempts >= s.admin_cap).length, 0);
  const arbFull = groups.reduce((n, g) => n + g.sigs.filter(s => s.arbiter_cap && s.arbiter_rulings >= s.arbiter_cap).length, 0);
  const queueMajor = queue.filter(e => e.severity === 'major' || e.severity === 'critical').length;
  const inflAdm = inflight.filter(i => i.phase === 'admin').length;
  const inflArb = inflight.filter(i => i.phase === 'arbiter').length;

  const stats = [
    {label:'链在办', value: String(inflight.length), subNodes: 'Admin ' + inflAdm + ' · Arbiter ' + inflArb},
    {label:'待人工', value: String(queue.length), subNodes: queueMajor > 0 ? 'major+' + queueMajor : '无 major+'},
    {label:'上升件', value: String(escAll.length), subNodes: '近 24h ' + within24},
    {label:'签名水位', value: String(sigsN), subNodes: '顶格 Admin ' + adminFull + ' · Arbiter ' + arbFull},
    {label:'签名关联上升', value: String(linked), subNodes: '占水位 ' + (sigsN ? Math.round(linked * 100 / sigsN) : 0) + '%'},
  ];

  return h('div', {className:'proto-shell'},
    h(HeaderSim, {project, onProject: setProject, tab, onTab: setTab}),
    tab !== 'chain'
      ? h('div', {className:'bento', style:{padding:40}},
          h(Empty, {description:'现状页签——本原型仅重绘「处置链」页签'}))
      : [
        h('div', {className:'stats-row', 'data-proto-id':'chain-stats-row', key:'stats'},
          stats.map((s, i) => h(StatTile, {key:i, label:s.label, value:s.value, subNodes:s.subNodes}))),
        h(QueueCard, {key:'queue', items: queue, sigIdx, onOpen: setSel}),
        h(InFlightCard, {key:'inflight', items: inflight, onOpenRun: setSelRun}),
        h(QuotaCard, {key:'quotas', groups, onOpenSig: openSig}),
        h(EscalationsCard, {key:'esc', all: escAll, shown: escShown, filter: escFilter, onFilter: setEscFilter, sigIdx, onOpen: setSel}),
      ],
    h(EscDrawer, {esc: sel, sigIdx, onClose: () => setSel(null)}),
    h(InflightRunModal, {it: selRun, onClose: () => setSelRun(null)}),
    h('div', {className:'proto-note'},
      '原型注记：数据为 ' + DATA.snapshot.replace('T', ' ').slice(0, 16) + ' UTC 真实快照（链在办 ' + DATA.in_flight.length +
      ' 件及其处置过程为演示注入示例）· round2 批注落实：人工队列置首（空则整卡隐藏）+ 内嵌裁决控件、在办行点击弹出处置过程窗（复用 agent 运行记录窗形态）· round3 批注落实：裁决控件面板式重设计、签名配额行信号名可点击查看处置过程（待人工优先）· 仅桌面稿 · redesign-chain-panel-ui'),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  h(ConfigProvider, {theme: THEME}, h(App)));
</script>
<script src="annotator.js" defer></script>
</body>
</html>
