<div class="wrap">
  <h1>统一标题栏原型（unified-page-title-bar）</h1>

  <a class="card" href="standalone.html">
    <div class="t">standalone — 独立访问形态</div>

    <div class="t">embed — dsh web 嵌入形态</div>
